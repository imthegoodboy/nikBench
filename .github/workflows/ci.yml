name: nikbench-scorer-ci

on:
  push:
  pull_request:

jobs:
  selftest:
    name: aggregate.py selftest
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run scorer selftest against example scorecards
        run: python scripts/aggregate.py --selftest examples/scorecards
      - name: Render example leaderboard to stdout (no errors = ok)
        run: python scripts/aggregate.py examples/scorecards
