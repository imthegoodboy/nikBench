  <text x="540" y="462" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#7FD4FF" letter-spacing="2.6">WCAG 2.1 CONTRAST · COMPUTED</text>
  <text x="540" y="478" font-family="Consolas, ui-monospace, monospace" font-size="7.8" fill="#F2F7FA" opacity="0.55">L = 0.2126R + 0.7152G + 0.0722B; c/12.92 if c ≤ 0.03928 else ((c+0.055)/1.055)^2.4; ratio = (L1+0.05)/(L2+0.05)</text>

