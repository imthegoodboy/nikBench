  <text x="60" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#7FD4FF" letter-spacing="3">EARTH OBSERVATION SYSTEM · BRAND BOARD 01</text>
  <text x="60" y="86" font-family="'Segoe UI', system-ui, sans-serif" font-size="33" font-weight="700" fill="#F2F7FA">A colour system for a living planet</text>
  <text x="60" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#F2F7FA" opacity="0.62">Eight tokens, two neutrals, one rule: every colour has a job and a place it may not go.</text>

