    <text x="742" y="550" font-family="Consolas, ui-monospace, monospace">L 0.58815 / 0.05450</text>
    <text x="920" y="550" font-family="Consolas, ui-monospace, monospace" fill="#7FD4FF">6.11:1</text>
    <text x="1010" y="550" font-size="8.6" fill="#7FD4FF">AA</text>

    <rect x="540" y="562" width="16" height="16" fill="#F2F7FA"/><rect x="556" y="562" width="16" height="16" fill="#1F6F43"/>
    <text x="584" y="574">ice on forest</text>
