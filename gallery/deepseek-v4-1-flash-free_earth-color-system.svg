  </g>
  <text x="540" y="684" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.4" fill="#F2F7FA" opacity="0.5">60 % field · 30 % structure · 10 % light. The 10 % is the only place atmosphere may fill area.</text>

  <text x="60" y="604" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#7FD4FF" letter-spacing="2.6">TYPE · SYSTEM FONTS ONLY</text>
  <text x="60" y="642" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700" fill="#F2F7FA">Earth, observed.</text>
  <text x="60" y="666" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#F2F7FA" opacity="0.8">Body / 12 — eight tokens, two neutrals, one planet.</text>
  <text x="60" y="686" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#F2F7FA" opacity="0.5">CAPTION / 09 · TELEMETRY, AXES, LEGAL</text>
  <text x="60" y="700" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#7FD4FF" opacity="0.7">DISPLAY 30 / BODY 12 / CAPTION 09 · never below 9 px</text>

  <text x="60" y="742" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" fill="#F2F7FA" opacity="0.42">Neutrals: surface #10141C and grid #222A36 are the only non-core tints, used for card fields and 1 px rules; they are not part of the brand palette.</text>
  <text x="60" y="758" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" fill="#F2F7FA" opacity="0.42">All ratios computed with the WCAG 2.1 relative-luminance formula above; judges may recompute from the listed L values.</text>
</svg>
