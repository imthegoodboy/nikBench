<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seven founders of computing on a to-scale 1800–2000 timeline">
  <!-- palette: paper #FAF7EF / ink #1F2A37 / teal #0E7490 / teal-light #7FC7C2 / amber #B45309 / grid #E3DDCF -->
  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/>
    </marker>
    <marker id="arrowK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0E7490"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#FAF7EF"/>

  <text x="60" y="52" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2A37">SEVEN FOUNDERS OF COMPUTING</text>
  <text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9AA6B2">To-scale life spans on the timeline 1800–2000 · birth years pinned on the axis · selected milestones marked ◆</text>

  <!-- lane grid: 7 chronologically ordered swimlanes sharing one to-scale axis -->
  <g stroke="#E3DDCF" stroke-width="1">
    <line x1="60" y1="140" x2="1140" y2="140"/>
    <line x1="60" y1="186" x2="1140" y2="186"/>
    <line x1="60" y1="232" x2="1140" y2="232"/>
    <line x1="60" y1="278" x2="1140" y2="278"/>
    <line x1="60" y1="324" x2="1140" y2="324"/>
    <line x1="60" y1="370" x2="1140" y2="370"/>
    <line x1="60" y1="416" x2="1140" y2="416"/>
    <line x1="60" y1="462" x2="1140" y2="462"/>
  </g>

  <!-- Ada Lovelace 1815–1852 · lane 1 (y 140) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="141" y="134" font-size="17" font-weight="700" fill="#1F2A37">Ada Lovelace <tspan fill="#9AA6B2" font-weight="400" font-size="12">1815–1852</tspan></text>
    <rect x="141" y="144" width="199.8" height="16" fill="#0E7490"/>
    <circle cx="141" cy="152" r="5" fill="#1F2A37"/>
    <circle cx="292.2" cy="152" r="4" fill="#B45309"/>
    <text x="299" y="186" font-size="11.5" fill="#1F2A37">first published algorithm (Note G, Analytical Engine, 1843 ◆)</text>
  </g>

  <!-- John von Neumann 1903–1957 · lane 2 (y 186) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="616.2" y="180" font-size="17" font-weight="700" fill="#1F2A37">John von Neumann <tspan fill="#9AA6B2" font-weight="400" font-size="12">1903–1957</tspan></text>
    <rect x="616.2" y="190" width="291.6" height="16" fill="#0E7490"/>
    <circle cx="616.2" cy="198" r="5" fill="#1F2A37"/>
    <circle cx="813" cy="198" r="4" fill="#B45309"/>
    <text x="624" y="232" font-size="11.5" fill="#1F2A37">stored-program architecture (EDVAC report, 1945 ◆)</text>
  </g>

  <!-- Grace Hopper 1906–1992 · lane 3 (y 232) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="632.4" y="226" font-size="17" font-weight="700" fill="#1F2A37">Grace Hopper <tspan fill="#9AA6B2" font-weight="400" font-size="12">1906–1992</tspan></text>
    <rect x="632.4" y="236" width="382.8" height="16" fill="#0E7490"/>
    <circle cx="632.4" cy="244" r="5" fill="#1F2A37"/>
    <text x="640" y="278" font-size="11.5" fill="#1F2A37">compilers &amp; COBOL (FLOW-MATIC 1958, COBOL 1959)</text>
  </g>

  <!-- Alan Turing 1912–1954 · lane 4 (y 278) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="664.8" y="272" font-size="17" font-weight="700" fill="#1F2A37">Alan Turing <tspan fill="#9AA6B2" font-weight="400" font-size="12">1912–1954</tspan></text>
    <rect x="664.8" y="282" width="226.8" height="16" fill="#0E7490"/>
    <circle cx="664.8" cy="290" r="5" fill="#1F2A37"/>
    <circle cx="697.2" cy="290" r="4" fill="#B45309"/>
    <text x="672" y="324" font-size="11.5" fill="#1F2A37">universal machine (1936 ◆)</text>
  </g>

  <!-- Claude Shannon 1916–2001 · lane 5 (y 324) · 2001 clips at the 2000 axis edge -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="686.4" y="318" font-size="17" font-weight="700" fill="#1F2A37">Claude Shannon <tspan fill="#9AA6B2" font-weight="400" font-size="12">1916–2001</tspan></text>
    <rect x="686.4" y="328" width="453.6" height="16" fill="#0E7490"/>
    <path d="M1140 328 L1140 344" stroke="#1F2A37" stroke-width="2" stroke-dasharray="2 2"/>
    <circle cx="686.4" cy="336" r="5" fill="#1F2A37"/>
    <circle cx="841.2" cy="336" r="4" fill="#B45309"/>
    <text x="694" y="370" font-size="11.5" fill="#1F2A37">information theory (A Mathematical Theory of Communication, 1948 ◆)</text>
  </g>

  <!-- Edsger Dijkstra 1930–2002 · lane 6 (y 370) -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="762" y="364" font-size="17" font-weight="700" fill="#1F2A37">Edsger Dijkstra <tspan fill="#9AA6B2" font-weight="400" font-size="12">1930–2002</tspan></text>
    <rect x="762" y="374" width="378" height="16" fill="#0E7490"/>
    <path d="M1140 374 L1140 390" stroke="#1F2A37" stroke-width="2" stroke-dasharray="2 2"/>
    <circle cx="762" cy="382" r="5" fill="#1F2A37"/>
    <text x="770" y="416" font-size="11.5" fill="#1F2A37">shortest path (1959); structured programming ("Go To Statement Considered Harmful", 1968)</text>
  </g>

  <!-- Donald Knuth 1938– · lane 7 (y 416) · living, bar runs to the axis edge -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="805.2" y="410" font-size="17" font-weight="700" fill="#1F2A37">Donald Knuth <tspan fill="#9AA6B2" font-weight="400" font-size="12">b. 1938</tspan></text>
    <rect x="805.2" y="420" width="334.8" height="16" fill="#7FC7C2"/>
    <path d="M1140 428 L1130 423 L1130 433 Z" fill="#0E7490"/>
    <circle cx="805.2" cy="428" r="5" fill="#1F2A37"/>
    <text x="813" y="462" font-size="11.5" fill="#1F2A37">The Art of Computer Programming (vol. 1, 1968); analysis of algorithms</text>
  </g>

  <!-- to-scale time axis 1800–2000 -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#1F2A37">
    <line x1="60" y1="520" x2="1140" y2="520" stroke="#1F2A37" stroke-width="2"/>
    <line x1="60" y1="514" x2="60" y2="526" stroke="#1F2A37" stroke-width="2"/>
    <line x1="195" y1="514" x2="195" y2="526" stroke="#8B93A0" stroke-width="1.5"/>
    <line x1="330" y1="514" x2="330" y2="526" stroke="#8B93A0" stroke-width="1.5"/>
    <line x1="465" y1="514" x2="465" y2="526" stroke="#8B93A0" stroke-width="1.5"/>
    <line x1="600" y1="514" x2="600" y2="526" stroke="#1F2A37" stroke-width="2"/>
    <line x1="735" y1="514" x2="735" y2="526" stroke="#8B93A0" stroke-width="1.5"/>
    <line x1="870" y1="514" x2="870" y2="526" stroke="#8B93A0" stroke-width="1.5"/>
    <line x1="1005" y1="514" x2="1005" y2="526" stroke="#8B93A0" stroke-width="1.5"/>
    <line x1="1140" y1="514" x2="1140" y2="526" stroke="#1F2A37" stroke-width="2"/>
    <g font-size="13" text-anchor="middle">
      <text x="60" y="546">1800</text><text x="195" y="546">1825</text><text x="330" y="546">1850</text>
      <text x="465" y="546">1875</text><text x="600" y="546">1900</text><text x="735" y="546">1925</text>
      <text x="870" y="546">1950</text><text x="1005" y="546">1975</text><text x="1140" y="546">2000</text>
    </g>
    <text x="600" y="572" font-size="12" fill="#9AA6B2" text-anchor="middle">5.4 px per year — bars are true to scale; dots mark birth years; ◆ marks the milestone year</text>
  </g>

  <!-- influence arrows -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11.5">
    <path d="M700 282 C 700 240 740 200 806 196" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowT)"/>
    <text x="722" y="212" fill="#B45309">universal machine (1936) → stored-program EDVAC (1945)</text>
    <path d="M338 152 C 480 130 560 150 664 276" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowT)"/>
    <text x="356" y="128" fill="#B45309">programming idea (1843 Note G) → Turing discusses "Lady Lovelace's Objection" in his 1950 Mind paper</text>
  </g>

  <text x="60" y="640" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9AA6B2">Reading: the founders' working lives overlap almost completely after 1930 — computing is a single continuous conversation. Shannon's and Dijkstra's bars end past the 2000 axis; Knuth (teal, arrow tip) is still alive.</text>
</svg>
