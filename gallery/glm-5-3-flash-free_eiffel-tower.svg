<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architectural elevation of the Eiffel Tower (1889), height 330 m, base 125 m, platforms at 57 m, 115 m, 276 m">
  <!-- palette: sky #F3EBD9 / haze #E9DFC7 / iron #704A28 / iron-dark #4A3113 / deck #5A3A1E / ink #1F2A37 -->
  <!-- scale geometry: ground y=850, 330 m at y=50 ⇒ 2.4242 px/m (800 px / 330 m).
       platforms: 57 m → y=711.8 · 115 m → y=571.2 · 276 m → y=180.9.
       base 125 m ⇒ 302.9 px: outer legs x=148.5 to 451.5, axis x=300. -->
  <defs>
    <linearGradient id="v5sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EBD9"/>
      <stop offset="1" stop-color="#E7D9BC"/>
    </linearGradient>
    <filter id="v5haze" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect x="0" y="0" width="600" height="900" fill="url(#v5sky)"/>
  <ellipse cx="300" cy="250" rx="340" ry="130" fill="#E9DFC7" opacity="0.8" filter="url(#v5haze)"/>
  <ellipse cx="300" cy="640" rx="360" ry="150" fill="#E9DFC7" opacity="0.45" filter="url(#v5haze)"/>

  <!-- annotation block + scale bar -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#1F2A37">
    <text x="30" y="84" font-size="15" font-weight="700">1889 · 330 m overall · 125 m base</text>
    <text x="30" y="102" font-size="12.5">platforms 57 / 115 / 276 m — elevation drawn to scale</text>
    <line x1="40" y1="866" x2="282.4" y2="866" stroke="#1F2A37" stroke-width="2"/>
    <line x1="40" y1="860" x2="40" y2="872" stroke="#1F2A37" stroke-width="2"/>
    <line x1="161.2" y1="862" x2="161.2" y2="870" stroke="#1F2A37" stroke-width="1.5"/>
    <line x1="282.4" y1="860" x2="282.4" y2="872" stroke="#1F2A37" stroke-width="2"/>
    <text x="40" y="884" font-size="10.5">0 m</text>
    <text x="161.2" y="884" font-size="10.5" text-anchor="middle">50 m</text>
    <text x="282.4" y="884" font-size="10.5" text-anchor="end">100 m</text>
  </g>

  <!-- ============ left half (authored); mirrored about the axis x=300 ============ -->
  <g id="v5half">
    <!-- front-left leg (splayed, curved): foot on ground, head at platform 1 -->
    <path d="M148.5 850 C 170 800 196 745 206 712 L 244 712 C 232 760 222 812 216 850 Z"
          fill="#704A28" stroke="#4A3113" stroke-width="1.2"/>
    <!-- rear-left leg, hazed for depth -->
    <path d="M176 850 C 194 806 212 750 222 716 L 250 716 C 240 762 232 812 226 850 Z"
          fill="#8A6A4A" opacity="0.55"/>
    <!-- leg lattice: X-braces on the front leg (rows between y 712 and 850) -->
    <g stroke="#4A3113" stroke-width="1.3" fill="none">
      <line x1="157.7" y1="828" x2="226.1" y2="800"/><line x1="220.4" y1="828" x2="169.3" y2="800"/>
      <line x1="169.3" y1="800" x2="231.8" y2="772"/><line x1="231.8" y1="800" x2="181" y2="772"/>
      <line x1="181" y1="772" x2="237.5" y2="744"/><line x1="237.5" y1="772" x2="192.7" y2="744"/>
      <line x1="192.7" y1="744" x2="244" y2="712"/><line x1="237.5" y1="744" x2="206" y2="712"/>
    </g>
    <!-- depth braces between front and rear leg -->
    <g stroke="#5A4326" stroke-width="1.1" fill="none">
      <line x1="158" y1="826" x2="176" y2="804"/><line x1="158" y1="800" x2="176" y2="778"/>
      <line x1="158" y1="774" x2="176" y2="752"/>
    </g>
    <!-- mid-section column (platform 1 → platform 2) with X-bracing -->
    <g stroke="#4A3113" stroke-width="1.3" fill="none">
      <line x1="230.2" y1="690" x2="254.8" y2="660"/><line x1="246.2" y1="690" x2="238.8" y2="660"/>
      <line x1="238.8" y1="660" x2="263.3" y2="630"/><line x1="254.8" y1="660" x2="247.3" y2="630"/>
      <line x1="247.3" y1="630" x2="271.8" y2="600"/><line x1="263.3" y1="630" x2="255.8" y2="600"/>
      <line x1="255.8" y1="600" x2="279.4" y2="573"/><line x1="271.8" y1="600" x2="263.4" y2="573"/>
    </g>
    <g stroke="#704A28" stroke-width="1.6" fill="none">
      <line x1="228.6" y1="690" x2="247.8" y2="690"/>
      <line x1="236.9" y1="660" x2="256.4" y2="660"/>
      <line x1="245.3" y1="630" x2="264.9" y2="630"/>
      <line x1="253.8" y1="600" x2="273.4" y2="600"/>
    </g>
    <!-- upper shaft (platform 2 → platform 3) tapering, X-bracing + stringers -->
    <g stroke="#4A3113" stroke-width="1.2" fill="none">
      <line x1="265.8" y1="541" x2="283.5" y2="481"/><line x1="279.8" y1="541" x2="269.5" y2="481"/>
      <line x1="269.5" y1="481" x2="287.2" y2="421"/><line x1="283.5" y1="481" x2="273.2" y2="421"/>
      <line x1="273.2" y1="421" x2="290.9" y2="361"/><line x1="287.2" y1="421" x2="276.9" y2="361"/>
      <line x1="276.9" y1="361" x2="294.6" y2="301"/><line x1="290.9" y1="361" x2="280.6" y2="301"/>
    </g>
    <g stroke="#704A28" stroke-width="1.4" fill="none">
      <line x1="265.8" y1="541" x2="279.8" y2="541"/>
      <line x1="269.5" y1="481" x2="283.5" y2="481"/>
      <line x1="273.2" y1="421" x2="287.2" y2="421"/>
      <line x1="276.9" y1="361" x2="290.9" y2="361"/>
      <line x1="280.6" y1="301" x2="294.6" y2="301"/>
    </g>
    <g stroke="#4A3113" stroke-width="1.1" fill="none">
      <line x1="280.6" y1="301" x2="298.3" y2="241"/><line x1="294.6" y1="301" x2="284.3" y2="241"/>
      <line x1="284.3" y1="241" x2="301.7" y2="186"/><line x1="298.3" y1="241" x2="287.7" y2="186"/>
      <line x1="284.3" y1="241" x2="298.3" y2="241"/>
    </g>
  </g>
  <use href="#v5half" transform="translate(600,0) scale(-1,1)"/>

  <!-- ============ axis-symmetric elements (drawn once) ============ -->
  <!-- the two great decorative arches between the legs -->
  <path d="M244 712 Q 300 838 356 712" fill="none" stroke="#3C2817" stroke-width="5"/>
  <path d="M258 716 Q 300 816 342 716" fill="none" stroke="#8A6A4A" stroke-width="3" opacity="0.6"/>

  <!-- platform decks: 57 m (y=711.8), 115 m (y=571.2), 276 m (y=180.9) -->
  <rect x="200" y="708" width="200" height="7" fill="#5A3A1E"/>
  <line x1="200" y1="718" x2="400" y2="718" stroke="#4A3113" stroke-width="1.5"/>
  <rect x="256" y="568" width="88" height="6" fill="#5A3A1E"/>
  <line x1="256" y1="576" x2="344" y2="576" stroke="#4A3113" stroke-width="1.2"/>
  <rect x="284" y="178" width="32" height="5" fill="#5A3A1E"/>
  <line x1="284" y1="185" x2="316" y2="185" stroke="#4A3113" stroke-width="1"/>
  <line x1="281" y1="172" x2="319" y2="172" stroke="#704A28" stroke-width="1.6"/>
  <line x1="288" y1="167" x2="312" y2="167" stroke="#704A28" stroke-width="1.2"/>

  <!-- Campanile-level detail: clustered truss above the mid shaft -->
  <g stroke="#4A3113" stroke-width="1.2" fill="none">
    <line x1="266" y1="562" x2="300" y2="520"/><line x1="300" y1="562" x2="266" y2="520"/>
    <line x1="300" y1="562" x2="334" y2="520"/><line x1="334" y1="562" x2="300" y2="520"/>
    <line x1="266" y1="562" x2="300" y2="526"/><line x1="300" y1="562" x2="334" y2="526"/>
  </g>

  <!-- upper tower lantern: balcony, cupola, antenna to 330 m (y=50) -->
  <line x1="288" y1="150" x2="312" y2="150" stroke="#704A28" stroke-width="2"/>
  <line x1="292" y1="140" x2="308" y2="140" stroke="#704A28" stroke-width="1.6"/>
  <path d="M286 181 Q 300 300 314 181" fill="none" stroke="#3C2817" stroke-width="2"/>
  <line x1="296" y1="181" x2="300" y2="62" stroke="#4A3113" stroke-width="2"/>
  <line x1="304" y1="181" x2="300" y2="62" stroke="#4A3113" stroke-width="2"/>
  <circle cx="300" cy="56" r="3" fill="#3C2817"/>

  <!-- ground line -->
  <line x1="90" y1="850" x2="510" y2="850" stroke="#1F2A37" stroke-width="2.5"/>
</svg>
