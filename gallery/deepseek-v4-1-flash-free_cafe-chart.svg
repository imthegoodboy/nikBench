<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Café revenue over 24 months, showing seasonality, a modest renovation level change, and one festival outlier">
  <rect width="900" height="500" fill="#FBF9F4"/>

  <text x="70" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="700" fill="#1B2430">After the renovation, revenue is +2.0% year-on-year — inside seasonal noise</text>
  <text x="70" y="60" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5C6B78">Not “+62% growth”: month 19 is one festival weekend. The line is raw months; the heavy line is a 3-month rolling median that ignores that spike.</text>

  <rect x="207.4" y="92" width="103" height="318" fill="#D9B26A" opacity="0.10"/>
  <text x="258.9" y="106" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#8A6A2F" text-anchor="middle">summer season</text>

  <g stroke="#DDE3E8" stroke-width="1">
    <line x1="70" y1="400" x2="860" y2="400"/>
    <line x1="70" y1="350" x2="860" y2="350"/>
    <line x1="70" y1="300" x2="860" y2="300"/>
    <line x1="70" y1="250" x2="860" y2="250"/>
    <line x1="70" y1="200" x2="860" y2="200"/>
    <line x1="70" y1="150" x2="860" y2="150"/>
    <line x1="70" y1="100" x2="860" y2="100"/>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#5C6B78" text-anchor="end">
    <text x="62" y="404">35 000</text>
    <text x="62" y="354">40 000</text>
    <text x="62" y="304">45 000</text>
    <text x="62" y="254">50 000</text>
    <text x="62" y="204">55 000</text>
    <text x="62" y="154">60 000</text>
    <text x="62" y="104">65 000</text>
  </g>

  <line x1="70" y1="410" x2="70" y2="92" stroke="#1B2430" stroke-width="1.4"/>
  <line x1="70" y1="410" x2="860" y2="410" stroke="#1B2430" stroke-width="1.4"/>

  <line x1="482.2" y1="92" x2="482.2" y2="410" stroke="#B5482E" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="488" y="126" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#B5482E">M13 · renovation begins</text>
  <text x="488" y="139" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#8C3A26">closed 10 days</text>

  <polyline points="70,362 104.3,370.5 138.7,339 173,348 207.4,322.5 241.7,317 276.1,298.1 310.4,302 344.8,331 379.1,344 413.5,367 447.8,358.5 482.2,340 516.5,335 550.9,331 585.2,339 619.6,342 653.9,329 688.3,115 722.6,323 757,327 791.3,341 825.7,352 860,349"
            fill="none" stroke="#4A6A7A" stroke-width="1.4" opacity="0.75"/>

  <polyline points="104.3,362 138.7,348 173,339 207.4,322.5 241.7,317 276.1,302 310.4,302 344.8,331 379.1,344 413.5,358.5 447.8,358.5 482.2,340 516.5,335 550.9,335 585.2,339 619.6,339 653.9,329 688.3,323 722.6,323 757,327 791.3,341 825.7,349"
            fill="none" stroke="#1B2430" stroke-width="2.8" stroke-linejoin="round"/>

