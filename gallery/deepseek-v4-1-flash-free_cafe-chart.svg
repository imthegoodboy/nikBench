    <circle cx="70" cy="362" r="2.6"/><circle cx="104.3" cy="370.5" r="2.6"/>
    <circle cx="138.7" cy="339" r="2.6"/><circle cx="173" cy="348" r="2.6"/>
    <circle cx="207.4" cy="322.5" r="2.6"/><circle cx="241.7" cy="317" r="2.6"/>
    <circle cx="276.1" cy="298.1" r="2.6"/><circle cx="310.4" cy="302" r="2.6"/>
    <circle cx="344.8" cy="331" r="2.6"/><circle cx="379.1" cy="344" r="2.6"/>
    <circle cx="413.5" cy="367" r="2.6"/><circle cx="447.8" cy="358.5" r="2.6"/>
    <circle cx="482.2" cy="340" r="2.6"/><circle cx="516.5" cy="335" r="2.6"/>
    <circle cx="550.9" cy="331" r="2.6"/><circle cx="585.2" cy="339" r="2.6"/>
    <circle cx="619.6" cy="342" r="2.6"/><circle cx="653.9" cy="329" r="2.6"/>
    <circle cx="722.6" cy="323" r="2.6"/><circle cx="757" cy="327" r="2.6"/>
    <circle cx="791.3" cy="341" r="2.6"/><circle cx="825.7" cy="352" r="2.6"/>
    <circle cx="860" cy="349" r="2.6"/>
  </g>

  <circle cx="688.3" cy="115" r="6.5" fill="none" stroke="#B5482E" stroke-width="2"/>
  <circle cx="688.3" cy="115" r="2.8" fill="#B5482E"/>
  <path d="M694,110 L716,92" stroke="#B5482E" stroke-width="1"/>
  <text x="720" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#B5482E">M19 · city festival weekend</text>
  <text x="720" y="101" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#8C3A26">€63 500 once — excluded from trend</text>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#5C6B78" text-anchor="middle">
    <text x="70" y="426">1</text><text x="104.3" y="426">2</text><text x="138.7" y="426">3</text>
    <text x="173" y="426">4</text><text x="207.4" y="426">5</text><text x="241.7" y="426">6</text>
    <text x="276.1" y="426">7</text><text x="310.4" y="426">8</text><text x="344.8" y="426">9</text>
    <text x="379.1" y="426">10</text><text x="413.5" y="426">11</text><text x="447.8" y="426">12</text>
    <text x="482.2" y="426">13</text><text x="516.5" y="426">14</text><text x="550.9" y="426">15</text>
    <text x="585.2" y="426">16</text><text x="619.6" y="426">17</text><text x="653.9" y="426">18</text>
    <text x="688.3" y="426">19</text><text x="722.6" y="426">20</text><text x="757" y="426">21</text>
    <text x="791.3" y="426">22</text><text x="825.7" y="426">23</text><text x="860" y="426">24</text>
  </g>
  <text x="465" y="442" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">month</text>

  <g transform="translate(20,250) rotate(-90)" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#5C6B78" text-anchor="middle">
    <text>revenue (EUR)</text>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#1B2430">
    <line x1="70" y1="466" x2="96" y2="466" stroke="#4A6A7A" stroke-width="1.4"/>
    <text x="102" y="469">raw monthly revenue</text>
    <line x1="240" y1="466" x2="266" y2="466" stroke="#1B2430" stroke-width="2.8"/>
    <text x="272" y="469">3-month rolling median (robust to M19)</text>
  </g>

  <text x="70" y="488" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#7C8894">YoY M13–M18: +5.7, +9.4, +1.9, +2.2, −4.6, −2.8 % (mean +2.0 %). M1–M6 vs M19–M24 mean +0.7 % once M19 is removed.</text>
</svg>
