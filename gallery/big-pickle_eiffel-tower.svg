<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Architectural elevation of the Eiffel Tower drawn to scale: ground line at y=850, 330 m at y=50, the three platforms at 57, 115 and 276 metres, four splayed legs, two decorative arcade arches, lattice bracing, a tapering shaft and an antenna.">
  <!-- palette: paper #FAF8F4, ink #22262B, steel #7A8794, bronze #B06A2C, sky #E3E8EC, muted #8A939C -->
  <!-- scale: ground y=850 (0 m), top y=50 (330 m) -> 1 m = 2.4242 px; base 125 m = 303 px (x 148.5 .. 451.5); platform decks at y=711.8 (57 m), y=571.2 (115 m), y=180.9 (276 m) -->
  <rect width="600" height="900" fill="#FAF8F4"/>
  <rect x="20" y="40" width="560" height="810" fill="#E3E8EC" opacity="0.45"/>

  <!-- annotation block -->
  <text x="30" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#22262B">1889 &#183; 330 m overall &#183; 125 m base</text>
  <text x="30" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#22262B">platforms 57 / 115 / 276 m</text>
  <text x="30" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A939C">1 m = 2.4242 px &#183; deck lines land on 712 / 571 / 181</text>
  <text x="570" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#22262B" text-anchor="end" letter-spacing="1.1">TOUR EIFFEL &#183; ARCHITECTURAL ELEVATION</text>

  <!-- the two large decorative arches between the legs -->
  <path d="M214 800 Q300 700 386 800" fill="none" stroke="#22262B" stroke-width="1.5"/>
  <path d="M216 806 Q300 752 384 806" fill="none" stroke="#22262B" stroke-width="1.2"/>

  <!-- LATTICE: lower legs (0-57 m), X-braces + rungs, left then mirrored right -->
  <g stroke="#7A8794" stroke-width="0.9" fill="none">
    <line x1="148.5" y1="850" x2="213" y2="805.6"/>
    <line x1="205" y1="850" x2="156.2" y2="805.6"/>
    <line x1="156.2" y1="805.6" x2="220.3" y2="765.2"/>
    <line x1="213" y1="805.6" x2="171.8" y2="765.2"/>
    <line x1="171.8" y1="765.2" x2="226.2" y2="732.7"/>
    <line x1="220.3" y1="765.2" x2="192.5" y2="732.7"/>
    <line x1="192.5" y1="732.7" x2="230" y2="711.8"/>
    <line x1="226.2" y1="732.7" x2="215.1" y2="711.8"/>
    <line x1="156.2" y1="805.6" x2="213" y2="805.6"/>
    <line x1="171.8" y1="765.2" x2="220.3" y2="765.2"/>
    <line x1="192.5" y1="732.7" x2="226.2" y2="732.7"/>
    <line x1="451.5" y1="850" x2="387" y2="805.6"/>
    <line x1="395" y1="850" x2="443.8" y2="805.6"/>
    <line x1="443.8" y1="805.6" x2="379.7" y2="765.2"/>
    <line x1="387" y1="805.6" x2="428.2" y2="765.2"/>
    <line x1="428.2" y1="765.2" x2="373.8" y2="732.7"/>
    <line x1="379.7" y1="765.2" x2="407.5" y2="732.7"/>
    <line x1="407.5" y1="732.7" x2="370" y2="711.8"/>
    <line x1="373.8" y1="732.7" x2="384.9" y2="711.8"/>
    <line x1="387" y1="805.6" x2="443.8" y2="805.6"/>
    <line x1="379.7" y1="765.2" x2="428.2" y2="765.2"/>
    <line x1="373.8" y1="732.7" x2="407.5" y2="732.7"/>
  </g>

  <!-- LATTICE: middle section (57-115 m) -->
  <g stroke="#7A8794" stroke-width="0.9" fill="none">
    <line x1="215.1" y1="711.8" x2="375.6" y2="676.7"/>
    <line x1="384.9" y1="711.8" x2="224.4" y2="676.7"/>
    <line x1="224.4" y1="676.7" x2="366.3" y2="641.5"/>
    <line x1="375.6" y1="676.7" x2="233.7" y2="641.5"/>
    <line x1="233.7" y1="641.5" x2="357.4" y2="606.4"/>
    <line x1="366.3" y1="641.5" x2="242.6" y2="606.4"/>
    <line x1="242.6" y1="606.4" x2="348.5" y2="571.2"/>
    <line x1="357.4" y1="606.4" x2="251.5" y2="571.2"/>
    <line x1="224.4" y1="676.7" x2="375.6" y2="676.7"/>
    <line x1="233.7" y1="641.5" x2="366.3" y2="641.5"/>
    <line x1="242.6" y1="606.4" x2="357.4" y2="606.4"/>
  </g>

  <!-- LATTICE: upper shaft (115-276 m) -->
  <g stroke="#7A8794" stroke-width="0.85" fill="none">
    <line x1="251.5" y1="571.2" x2="342.8" y2="506"/>
    <line x1="348.5" y1="571.2" x2="257.2" y2="506"/>
    <line x1="257.2" y1="506" x2="337.2" y2="441"/>
    <line x1="342.8" y1="506" x2="262.8" y2="441"/>
    <line x1="262.8" y1="441" x2="331.5" y2="376"/>
    <line x1="337.2" y1="441" x2="268.5" y2="376"/>
    <line x1="268.5" y1="376" x2="325.8" y2="311"/>
    <line x1="331.5" y1="376" x2="274.2" y2="311"/>
    <line x1="274.2" y1="311" x2="320.1" y2="246"/>
    <line x1="325.8" y1="311" x2="279.9" y2="246"/>
    <line x1="279.9" y1="246" x2="314.5" y2="180.9"/>
    <line x1="320.1" y1="246" x2="285.5" y2="180.9"/>
    <line x1="257.2" y1="506" x2="342.8" y2="506"/>
    <line x1="262.8" y1="441" x2="337.2" y2="441"/>
    <line x1="268.5" y1="376" x2="331.5" y2="376"/>
    <line x1="274.2" y1="311" x2="325.8" y2="311"/>
    <line x1="279.9" y1="246" x2="320.1" y2="246"/>
  </g>

  <!-- LATTICE: lantern above the 276 m platform -->
  <g stroke="#7A8794" stroke-width="0.85" fill="none">
    <line x1="285.5" y1="180.9" x2="311" y2="152"/>
    <line x1="314.5" y1="180.9" x2="289" y2="152"/>
    <line x1="289" y1="152" x2="308" y2="122.7"/>
    <line x1="311" y1="152" x2="292" y2="122.7"/>
    <line x1="289" y1="152" x2="311" y2="152"/>
    <line x1="292" y1="122.7" x2="308" y2="122.7"/>
  </g>

  <!-- inner leg curves and outer silhouette -->
  <path d="M205 850 C207 790 220 730 230 711.8" fill="none" stroke="#7A8794" stroke-width="1.1"/>
  <path d="M395 850 C393 790 380 730 370 711.8" fill="none" stroke="#7A8794" stroke-width="1.1"/>
  <path d="M148.5 850 C152 790 185 730 215.1 711.8 C222 690 238 620 251.5 571.2 C262 520 280 240 285.5 180.9 C290 140 295 80 297.5 50" fill="none" stroke="#22262B" stroke-width="2.1"/>
  <path d="M451.5 850 C448 790 415 730 384.9 711.8 C378 690 362 620 348.5 571.2 C338 520 320 240 314.5 180.9 C310 140 305 80 302.5 50" fill="none" stroke="#22262B" stroke-width="2.1"/>

  <!-- platforms: deck tops exactly at 711.8 / 571.2 / 180.9 -->
  <rect x="207.1" y="711.8" width="185.8" height="7" fill="#B06A2C"/>
  <rect x="243.5" y="571.2" width="113" height="7" fill="#B06A2C"/>
  <rect x="281.5" y="180.9" width="37" height="6" fill="#B06A2C"/>
  <g stroke="#22262B" stroke-width="0.9" fill="none">
    <line x1="207.1" y1="711.8" x2="392.9" y2="711.8"/>
    <line x1="243.5" y1="571.2" x2="356.5" y2="571.2"/>
    <line x1="281.5" y1="180.9" x2="318.5" y2="180.9"/>
    <line x1="215.1" y1="722" x2="243.5" y2="711.8"/>
    <line x1="384.9" y1="722" x2="356.5" y2="711.8"/>
    <line x1="251.5" y1="583" x2="281.5" y2="571.2"/>
    <line x1="348.5" y1="583" x2="318.5" y2="571.2"/>
    <line x1="285.5" y1="191" x2="300" y2="180.9"/>
    <line x1="314.5" y1="191" x2="300" y2="180.9"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#B06A2C" font-weight="700">
    <text x="398" y="715">57 m</text>
    <text x="362" y="574">115 m</text>
    <text x="324" y="184">276 m</text>
  </g>

  <!-- antenna and beacon -->
  <line x1="300" y1="122.7" x2="300" y2="52" stroke="#22262B" stroke-width="1.6"/>
  <line x1="294" y1="96" x2="306" y2="96" stroke="#22262B" stroke-width="1.2"/>
  <line x1="296" y1="76" x2="304" y2="76" stroke="#22262B" stroke-width="1"/>
  <circle cx="300" cy="52" r="2.2" fill="#B06A2C"/>

  <!-- ground, footings and hatching -->
  <line x1="20" y1="850" x2="580" y2="850" stroke="#22262B" stroke-width="2.2"/>
  <rect x="146" y="850" width="60" height="12" fill="#7A8794"/>
  <rect x="394" y="850" width="60" height="12" fill="#7A8794"/>
  <g stroke="#8A939C" stroke-width="1">
    <line x1="40" y1="866" x2="52" y2="854"/>
    <line x1="80" y1="866" x2="92" y2="854"/>
    <line x1="120" y1="866" x2="132" y2="854"/>
    <line x1="468" y1="866" x2="480" y2="854"/>
    <line x1="508" y1="866" x2="520" y2="854"/>
    <line x1="548" y1="866" x2="560" y2="854"/>
  </g>

  <!-- 0-100 m scale bar -->
  <line x1="40" y1="878" x2="282.4" y2="878" stroke="#22262B" stroke-width="1.5"/>
  <line x1="40" y1="872" x2="40" y2="884" stroke="#22262B" stroke-width="1.5"/>
  <line x1="161.2" y1="874" x2="161.2" y2="882" stroke="#22262B" stroke-width="1"/>
  <line x1="282.4" y1="872" x2="282.4" y2="884" stroke="#22262B" stroke-width="1.5"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#22262B">
    <text x="36" y="896">0</text>
    <text x="150" y="896">50 m</text>
    <text x="278" y="896" text-anchor="end">100 m</text>
  </g>
  <text x="300" y="896" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#8A939C">scale bar (100 m = 242.4 px)</text>
</svg>
