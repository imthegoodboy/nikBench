<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Monthly cafe revenue, months 1 to 24, with the month-13 renovation and the month-19 festival outlier">
  <!-- PALETTE: paper #fbfaf7, ink #16212c, grid #e3e0d8, series blue #2f6f8f,
       pre-mean #97a0ab (dashed), post-mean #2f6f8f (dashed), renovation amber #e8b04a, outlier #b8412c. -->
  <rect width="900" height="500" fill="#fbfaf7"/>

  <text x="36" y="32" font-family="Georgia, serif" font-size="16.5" font-weight="700" fill="#16212c">
    Renovation &#8776; nothing: level change +&#8364;150/month (+0.4%), inside the noise. Seasonality &#177;9%; one festival weekend explains month 19.
  </text>
  <text x="36" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d4a58">
    Pre-renovation mean (m1&#8211;12) = &#8364;41,170/month. Post-renovation mean (m14&#8211;24, month 19 excluded) = &#8364;41,320/month. Difference +&#8364;150 (+0.4%), standard error &#8364;737, 95% CI &#177;&#8364;1,440.
  </text>
  <text x="36" y="68" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3d4a58">
    Month 19 = &#8364;63,500, a single festival weekend, +&#8364;22,180 (+53.7%) over expectation; it is excluded from the level estimate, not from the chart. Month 13 was closed 10 days.
  </text>

  <!-- gridlines + y axis: 35 000 .. 65 000 EUR, truncated and labelled -->
  <g stroke="#e3e0d8" stroke-width="1">
    <line x1="92" y1="110" x2="868" y2="110"/><line x1="92" y1="151.7" x2="868" y2="151.7"/>
    <line x1="92" y1="193.3" x2="868" y2="193.3"/><line x1="92" y1="235" x2="868" y2="235"/>
    <line x1="92" y1="276.7" x2="868" y2="276.7"/><line x1="92" y1="318.3" x2="868" y2="318.3"/>
    <line x1="92" y1="360" x2="868" y2="360"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c6874" text-anchor="end">
    <text x="86" y="400">&#8364;35,000</text><text x="86" y="363.5">&#8364;40,000</text>
    <text x="86" y="305">&#8364;45,000</text><text x="86" y="238.5">&#8364;50,000</text>
    <text x="86" y="180">&#8364;55,000</text><text x="86" y="121.5">&#8364;60,000</text>
    <text x="86" y="113.5">&#8364;65,000</text>
  </g>
  <text x="20" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#16212c"
        transform="rotate(-90 20 256)" text-anchor="middle">Revenue per month (EUR)</text>

  <!-- renovation band: month 13 -->
  <rect x="487" y="110" width="54" height="290" fill="#e8b04a" opacity="0.22"/>
  <line x1="496.9" y1="110" x2="496.9" y2="400" stroke="#b07c12" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="503" y="128" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#7a5606">month 13: renovation,</text>
  <text x="503" y="141" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#7a5606">closed 10 days</text>

  <!-- pre / post mean segments (two separate lines, no regression across the break) -->
  <line x1="92" y1="340.4" x2="463.1" y2="340.4" stroke="#97a0ab" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="496.9" y1="338.9" x2="868" y2="338.9" stroke="#2f6f8f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="92" y="334" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c6874">pre mean &#8364;41,170</text>
  <text x="868" y="332" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f6f8f" text-anchor="end">post mean &#8364;41,320 (excl. m19)</text>

  <!-- series: straight segments, no smoothing (smoothing would invent curvature) -->
  <polyline fill="none" stroke="#2f6f8f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
    points="92,363.3 125.7,371.5 159.5,341 193.2,349.7 226.9,325.1 260.7,319.8 294.4,301.5 328.2,305.3 361.9,333.3 395.7,345.9 429.4,368.1 463.1,359.9 496.9,342 530.6,337.2 564.3,333.3 598.1,341 631.8,343.9 665.5,331.4 699.3,124.5 733,325.6 766.7,329.4 800.5,343 834.2,353.6 868,350.7"/>
  <g fill="#2f6f8f">
    <circle cx="92" cy="363.3" r="3"/><circle cx="125.7" cy="371.5" r="3"/><circle cx="159.5" cy="341" r="3"/>
    <circle cx="193.2" cy="349.7" r="3"/><circle cx="226.9" cy="325.1" r="3"/><circle cx="260.7" cy="319.8" r="3"/>
    <circle cx="294.4" cy="301.5" r="3"/><circle cx="328.2" cy="305.3" r="3"/><circle cx="361.9" cy="333.3" r="3"/>
    <circle cx="395.7" cy="345.9" r="3"/><circle cx="429.4" cy="368.1" r="3"/><circle cx="463.1" cy="359.9" r="3"/>
    <circle cx="496.9" cy="342" r="3" fill="#b07c12"/>
    <circle cx="530.6" cy="337.2" r="3"/><circle cx="564.3" cy="333.3" r="3"/><circle cx="598.1" cy="341" r="3"/>
    <circle cx="631.8" cy="343.9" r="3"/><circle cx="665.5" cy="331.4" r="3"/>
    <circle cx="733" cy="325.6" r="3"/><circle cx="766.7" cy="329.4" r="3"/><circle cx="800.5" cy="343" r="3"/>
    <circle cx="834.2" cy="353.6" r="3"/><circle cx="868" cy="350.7" r="3"/>
  </g>

  <!-- the outlier, drawn as the anomaly it is -->
  <circle cx="699.3" cy="124.5" r="7" fill="#fbfaf7" stroke="#b8412c" stroke-width="2.6"/>
  <line x1="699.3" y1="124.5" x2="699.3" y2="338.9" stroke="#b8412c" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.9"/>
  <path d="M699.3 124.5 L726 108 L806 108" fill="none" stroke="#b8412c" stroke-width="1.2"/>
  <rect x="724" y="88" width="152" height="42" rx="4" fill="#fbfaf7" stroke="#b8412c" stroke-width="1"/>
  <text x="732" y="104" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b8412c">month 19: one-off</text>
  <text x="732" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7c2f1f">festival weekend, &#8364;63,500</text>
  <text x="716" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#b8412c">+&#8364;22,180 vs post mean (+53.7%)</text>

  <!-- axes -->
  <line x1="92" y1="400" x2="868" y2="400" stroke="#16212c" stroke-width="1.6"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5c6874" text-anchor="middle">
    <text x="92" y="415">m1</text><text x="226.9" y="415">m5</text><text x="463.1" y="415">m12</text>
    <text x="496.9" y="415" fill="#b07c12" font-weight="700">m13</text><text x="665.5" y="415">m18</text>
    <text x="699.3" y="415" fill="#b8412c" font-weight="700">m19</text><text x="868" y="415">m24</text>
  </g>
  <text x="480" y="436" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#16212c" text-anchor="middle">Month (24 months, sequential)</text>

  <!-- delta panel -->
  <rect x="36" y="446" width="828" height="42" rx="5" fill="#16212c"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e8eef5">
    <text x="50" y="462">Level change (m14&#8211;24 vs m1&#8211;12)</text>
    <text x="50" y="478" fill="#7ee3c3" font-weight="700">+&#8364;150 / mo &#183; +0.4% &#183; 95% CI &#177;&#8364;1,440 &#8594; NOT distinguishable from zero</text>
    <text x="474" y="462">Seasonality (m1&#8211;12)</text>
    <text x="474" y="478" fill="#7ee3c3" font-weight="700">peak m7 +9.8%, trough m2 &#8722;7.8%, unchanged</text>
    <text x="800" y="462">Outlier</text>
    <text x="800" y="478" fill="#ff9d8a" font-weight="700">m19 only</text>
  </g>
</svg>
