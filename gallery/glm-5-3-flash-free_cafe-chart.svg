<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="24 months of café revenue: seasonality, renovation level change at month 13, and a one-off festival outlier at month 19">
  <!-- palette: ink #1F2A37 / series #0E7490 / outlier #C1440E / band #E3DDCF / grid #D8D2C4 / paper #FAF7EF -->
  <rect x="0" y="0" width="900" height="500" fill="#FAF7EF"/>

  <!-- honest headline: decomposition first, renovation effect neutral -->
  <text x="40" y="34" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2A37">The renovation's effect is ambiguous — modest at best (+0.3%), not "growth"</text>
  <text x="40" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2A37">
    <tspan font-weight="700">Season:</tspan> ±~4–5% swing, peak Jul-Aug, trough Nov-Feb ·
    <tspan font-weight="700">Level:</tspan> pre-mean €41,170/mo vs post-mean €41,291/mo ex-festival <tspan font-weight="700">(+0.3%)</tspan> ·
    <tspan font-weight="700">Outlier:</tspan> month 19 festival = one-off +€22.0k over that baseline</text>

  <!-- axes -->
  <line x1="70" y1="450" x2="870" y2="450" stroke="#1F2A37" stroke-width="1.5"/>
  <line x1="70" y1="60"  x2="70"  y2="450" stroke="#1F2A37" stroke-width="1.5"/>

  <!-- horizontal grid + y labels (EUR), 0.0134483 px/EUR from €36,000 baseline -->
  <g stroke="#D8D2C4" stroke-width="1">
    <line x1="70" y1="396.2" x2="870" y2="396.2"/>
    <line x1="70" y1="342.4" x2="870" y2="342.4"/>
    <line x1="70" y1="288.7" x2="870" y2="288.7"/>
    <line x1="70" y1="234.9" x2="870" y2="234.9"/>
    <line x1="70" y1="181.1" x2="870" y2="181.1"/>
    <line x1="70" y1="127.3" x2="870" y2="127.3"/>
    <line x1="70" y1="73.5"  x2="870" y2="73.5"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1F2A37" text-anchor="end">
    <text x="64" y="453">€36k</text>
    <text x="64" y="399">€40k</text>
    <text x="64" y="345">€45k</text>
    <text x="64" y="292">€50k</text>
    <text x="64" y="238">€55k</text>
    <text x="64" y="185">€60k</text>
    <text x="64" y="131">€65k</text>
    <text x="64" y="77">€70k</text>
  </g>
  <text x="24" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1F2A37" transform="rotate(-90 24 255)" text-anchor="middle">Monthly revenue (EUR)</text>

  <!-- renovation band: month 13 (renovation begins, closed 10 days) -->
  <rect x="453.3" y="60" width="33.3" height="390" fill="#E3DDCF" opacity="0.55"/>
  <text x="470" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5A4A2F" text-anchor="middle">renovation</text>
  <text x="470" y="88" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A4A2F" text-anchor="middle">closed 10 d</text>
  <line x1="470" y1="92" x2="470" y2="450" stroke="#B49B64" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- series: months 1..24, y = 450 − (v − 36000) × 0.0134483, x = 70 + (m−1) × 33.33 -->
  <polyline fill="none" stroke="#0E7490" stroke-width="2.4" stroke-linejoin="round" points="
    70,412.4 103.3,423.8 136.7,381.4 170,393.5 203.3,359.2 236.7,351.8 270,326.4 303.3,331.7
    336.7,370.7 370,388.1 403.3,419.1 436.7,407.6 470,382.8 503.3,376.0 536.7,370.7 570,381.4
    603.3,385.4 636.7,368.0 670,80.2 703.3,359.9 736.7,365.3 770,384.1 803.3,398.9 836.7,394.9"/>

  <!-- month dots -->
  <g fill="#0E7490">
    <circle cx="70" cy="412.4" r="2.4"/><circle cx="103.3" cy="423.8" r="2.4"/><circle cx="136.7" cy="381.4" r="2.4"/>
    <circle cx="170" cy="393.5" r="2.4"/><circle cx="203.3" cy="359.2" r="2.4"/><circle cx="236.7" cy="351.8" r="2.4"/>
    <circle cx="270" cy="326.4" r="2.4"/><circle cx="303.3" cy="331.7" r="2.4"/><circle cx="336.7" cy="370.7" r="2.4"/>
    <circle cx="370" cy="388.1" r="2.4"/><circle cx="403.3" cy="419.1" r="2.4"/><circle cx="436.7" cy="407.6" r="2.4"/>
    <circle cx="470" cy="382.8" r="2.4"/><circle cx="503.3" cy="376.0" r="2.4"/><circle cx="536.7" cy="370.7" r="2.4"/>
    <circle cx="570" cy="381.4" r="2.4"/><circle cx="603.3" cy="385.4" r="2.4"/><circle cx="636.7" cy="368.0" r="2.4"/>
    <circle cx="703.3" cy="359.9" r="2.4"/><circle cx="736.7" cy="365.3" r="2.4"/><circle cx="770" cy="384.1" r="2.4"/>
    <circle cx="803.3" cy="398.9" r="2.4"/><circle cx="836.7" cy="394.9" r="2.4"/>
  </g>
  <!-- month 19 festival outlier marked distinctly -->
  <circle cx="670" cy="80.2" r="4.5" fill="#C1440E"/>

  <!-- outlier annotation: one-off, visually excluded from the level story -->
  <path d="M670 80.2 Q700 60 726 62 L733 64" fill="none" stroke="#C1440E" stroke-width="1.5"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#C1440E">
    <text x="736" y="58" font-weight="700">one-off city festival (m19): €63.5k</text>
    <text x="736" y="72">≈ +€22.0k vs post-baseline — NOT a level change</text>
  </g>

  <!-- seasonal envelope guide: pre-period Jul–Aug peak vs Nov–Feb trough implied by data -->
  <text x="200" y="314" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B63">summer peak ≈ €45–45.2k (m7–8)</text>
  <text x="392" y="438" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B63">winter trough ≈ €38–39k (m1–2, m11–12)</text>

  <!-- level comparison strip: pre vs post means (festival excluded) -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11">
    <rect x="540" y="118" width="112" height="14" fill="#0E7490" opacity="0.25"/>
    <text x="540" y="112" font-weight="700" fill="#1F2A37">pre-mean €41,170 (m1–12)</text>
    <rect x="540" y="140" width="112.4" height="14" fill="#0E7490" opacity="0.55"/>
    <text x="540" y="166" font-weight="700" fill="#1F2A37">post-mean €41,291 (m13–24, ex-festival)</text>
    <text x="660" y="150" font-weight="700" fill="#1F2A37">→ +0.3%: modest / ambiguous</text>
  </g>

  <!-- x labels: every other month for readability -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1F2A37" text-anchor="middle">
    <text x="70" y="466">m1</text><text x="136.7" y="466">m3</text><text x="203.3" y="466">m5</text>
    <text x="270" y="466">m7</text><text x="336.7" y="466">m9</text><text x="403.3" y="466">m11</text>
    <text x="470" y="466">m13</text><text x="536.7" y="466">m15</text><text x="603.3" y="466">m17</text>
    <text x="670" y="466">m19</text><text x="736.7" y="466">m21</text><text x="803.3" y="466">m23</text>
  </g>
  <text x="470" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1F2A37" text-anchor="middle">Month (1 = Jan, Year 1 → 24 = Dec, Year 2)</text>

  <!-- honest footnote -->
  <text x="40" y="432" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6B63">Renovation month itself sits inside normal seasonal variation (€41.0k in m13, closed 10 days). Months 14–24 ex-festival bracket the pre-period mean; any claimed "+X% growth" would come almost entirely from the festival outlier.</text>
</svg>
