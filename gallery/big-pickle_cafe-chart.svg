<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Café revenue over 24 months: bars for year one and year two with a seasonal template, a renovation marker at month 13, the month 19 festival annotated as a one-off, and a same-month delta strip showing the level change is inside the noise.">
  <!-- palette: ink #1a2230, muted #6b7280, grid #e3e6ec, y1 #5b7db1, y2 #2e7d6f, alert #c1440e, sand #f0d9b5 -->
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- headline -->
  <text x="78" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1.4">CAFÉ REVENUE &#183; 24 MONTHS &#183; EUR</text>
  <text x="78" y="45" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1a2230">Renovation: +1.2% like-for-like (+&#8364;486/mo) &#8212; inside the noise. The big +4.8% is one festival weekend.</text>

  <!-- y gridlines and labels (0 - 70k EUR) -->
  <g stroke="#e3e6ec" stroke-width="1">
    <line x1="78" y1="58" x2="862" y2="58"/>
    <line x1="78" y1="96.9" x2="862" y2="96.9"/>
    <line x1="78" y1="135.7" x2="862" y2="135.7"/>
    <line x1="78" y1="174.6" x2="862" y2="174.6"/>
    <line x1="78" y1="213.4" x2="862" y2="213.4"/>
    <line x1="78" y1="252.3" x2="862" y2="252.3"/>
    <line x1="78" y1="291.1" x2="862" y2="291.1"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">
    <text x="70" y="61">&#8364;70k</text>
    <text x="70" y="100">&#8364;60k</text>
    <text x="70" y="139">&#8364;50k</text>
    <text x="70" y="178">&#8364;40k</text>
    <text x="70" y="216">&#8364;30k</text>
    <text x="70" y="255">&#8364;20k</text>
    <text x="70" y="294">&#8364;10k</text>
    <text x="70" y="333">&#8364;0</text>
  </g>
  <text x="22" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" transform="rotate(-90 22 194)">monthly revenue (EUR)</text>

  <!-- renovation band + marker at the m12/m13 boundary -->
  <rect x="470" y="58" width="65.3" height="272" fill="#f0d9b5" opacity="0.34"/>
  <line x1="470" y1="58" x2="470" y2="330" stroke="#1a2230" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="474" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1a2230">renovation begins (m13)</text>
  <text x="474" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280">closed 10 days &#183; shaded m13&#8211;m14</text>

  <!-- legend inside the empty upper-left of the plot -->
  <rect x="90" y="68" width="11" height="11" fill="#5b7db1"/>
  <text x="107" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a2230">year 1 (m1&#8211;m12)</text>
  <rect x="90" y="86" width="11" height="11" fill="#2e7d6f"/>
  <text x="107" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a2230">year 2 (m13&#8211;m24)</text>
  <rect x="90" y="104" width="11" height="11" fill="#c1440e"/>
  <text x="107" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a2230">one-off (month 19, excluded)</text>
  <line x1="90" y1="127" x2="101" y2="127" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="107" y="131" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a2230">seasonal template (yr-1 shape)</text>

  <!-- year 1 bars -->
  <g fill="#5b7db1">
    <rect x="83.8" y="179.2" width="21" height="150.8"/>
    <rect x="116.5" y="182.5" width="21" height="147.5"/>
    <rect x="149.2" y="170.3" width="21" height="159.7"/>
    <rect x="181.8" y="173.8" width="21" height="156.2"/>
    <rect x="214.5" y="163.9" width="21" height="166.1"/>
    <rect x="247.2" y="161.8" width="21" height="168.2"/>
    <rect x="279.8" y="154.4" width="21" height="175.6"/>
    <rect x="312.5" y="155.9" width="21" height="174.1"/>
    <rect x="345.2" y="167.2" width="21" height="162.8"/>
    <rect x="377.8" y="172.2" width="21" height="157.8"/>
    <rect x="410.5" y="181.2" width="21" height="148.8"/>
    <rect x="443.2" y="177.9" width="21" height="152.1"/>
  </g>

  <!-- year 2 bars -->
  <g fill="#2e7d6f">
    <rect x="475.8" y="170.7" width="21" height="159.3"/>
    <rect x="508.5" y="168.7" width="21" height="161.3"/>
    <rect x="541.2" y="167.2" width="21" height="162.8"/>
    <rect x="573.8" y="170.3" width="21" height="159.7"/>
    <rect x="606.5" y="171.5" width="21" height="158.5"/>
    <rect x="639.2" y="166.4" width="21" height="163.6"/>
    <rect x="671.8" y="83.3" width="21" height="246.7" fill="#c1440e"/>
    <rect x="704.5" y="164.1" width="21" height="165.9"/>
    <rect x="737.2" y="165.6" width="21" height="164.4"/>
    <rect x="769.8" y="171.1" width="21" height="158.9"/>
    <rect x="802.5" y="175.4" width="21" height="154.6"/>
    <rect x="835.2" y="174.2" width="21" height="155.8"/>
  </g>

  <!-- seasonal template -->
  <polyline fill="none" stroke="#9aa3b2" stroke-width="1.8" stroke-dasharray="5 4"
    points="94.3,179.2 127,182.5 159.7,170.3 192.3,173.8 225,163.9 257.7,161.8 290.3,154.4 323,155.9 355.7,167.2 388.3,172.2 421,181.2 453.7,177.9 486.3,178.8 519,182.1 551.7,169.8 584.3,173.3 617,163.4 649.7,161.3 682.3,153.9 715,155.5 747.7,166.7 780.3,171.8 813,180.7 845.7,177.4"/>

  <!-- outlier annotation -->
  <polyline fill="none" stroke="#c1440e" stroke-width="1.2" points="692.8,86 700,92 700,62"/>
  <text x="704" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c1440e">m19 = &#8364;63,500 &#183; one-off city festival</text>
  <text x="704" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#c1440e">+&#8364;18,310 above its seasonal template</text>

  <!-- main baseline -->
  <line x1="78" y1="330" x2="862" y2="330" stroke="#1a2230" stroke-width="1.4"/>

  <!-- month ticks and year brackets -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">
    <text x="94.3" y="344">1</text>
    <text x="127" y="344">2</text>
    <text x="159.7" y="344">3</text>
    <text x="192.3" y="344">4</text>
    <text x="225" y="344">5</text>
    <text x="257.7" y="344">6</text>
    <text x="290.3" y="344">7</text>
    <text x="323" y="344">8</text>
    <text x="355.7" y="344">9</text>
    <text x="388.3" y="344">10</text>
    <text x="421" y="344">11</text>
    <text x="453.7" y="344">12</text>
    <text x="486.3" y="344">13</text>
    <text x="519" y="344">14</text>
    <text x="551.7" y="344">15</text>
    <text x="584.3" y="344">16</text>
    <text x="617" y="344">17</text>
    <text x="649.7" y="344">18</text>
    <text x="682.3" y="344">19</text>
    <text x="715" y="344">20</text>
    <text x="747.7" y="344">21</text>
    <text x="780.3" y="344">22</text>
    <text x="813" y="344">23</text>
    <text x="845.7" y="344">24</text>
  </g>
  <line x1="78" y1="350" x2="470" y2="350" stroke="#6b7280" stroke-width="1"/>
  <line x1="470" y1="350" x2="862" y2="350" stroke="#6b7280" stroke-width="1"/>
  <text x="274" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle">month (year 1)</text>
  <text x="666" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle">month (year 2)</text>

  <!-- like-for-like delta strip -->
  <text x="78" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1a2230">like-for-like &#916; = same month, year 2 &#8722; year 1 (&#8364;k)</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">
    <text x="70" y="375">+6</text>
    <text x="70" y="408">0</text>
    <text x="70" y="441">&#8722;6</text>
  </g>
  <g fill="#2e7d6f">
    <rect x="477.3" y="392.9" width="18" height="12.1"/>
    <rect x="510" y="385.5" width="18" height="19.5"/>
    <rect x="542.7" y="400.6" width="18" height="4.4"/>
    <rect x="575.3" y="400.05" width="18" height="5"/>
    <rect x="738.7" y="402.8" width="18" height="2.2"/>
    <rect x="771.3" y="403.35" width="18" height="1.7"/>
    <rect x="804" y="396.75" width="18" height="8.3"/>
    <rect x="836.7" y="399.8" width="18" height="5.2"/>
  </g>
  <g fill="#8894a6">
    <rect x="608" y="405" width="18" height="10.7"/>
    <rect x="640.7" y="405" width="18" height="6.6"/>
    <rect x="706" y="405" width="18" height="11.6"/>
  </g>
  <rect x="673.3" y="372" width="18" height="33" fill="#c1440e"/>
  <text x="682.3" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c1440e" text-anchor="middle">+18.3 (off scale)</text>
  <line x1="470" y1="405" x2="862" y2="405" stroke="#1a2230" stroke-width="1"/>
  <line x1="470" y1="402.3" x2="862" y2="402.3" stroke="#1a2230" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="845" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="end">ex-festival mean +&#8364;486/mo</text>

  <!-- honest decomposition footer -->
  <text x="78" y="466" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a2230">Seasonality: July +&#8364;4,020 / February &#8722;&#8364;3,220 against the yearly mean &#8212; the shape that repeats, and the largest single force in the series.</text>
  <text x="78" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a2230">Level change (renovation, m13): +&#8364;486/month like-for-like &#8776; +1.2% &#8212; only 0.30&#963; of the &#8364;1,630 spread of those same-month deltas.</text>
  <text x="78" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a2230">Outlier: month 19, +&#8364;18,310 over its template, one weekend &#8212; excluded from the level estimate, or it fabricates the +4.8%.</text>
</svg>
