<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Earth colour-system board: stylised Earth disc, eight swatch tokens with usage rules, WCAG contrast proofs, 60-30-10 usage bar, typographic hierarchy">
  <!-- palette (fixed core): void #05070D / ocean #0B3D91 / atmosphere #7FD4FF / forest #1F6F43 /
       sand #D9B26A / ice #F2F7FA / magma #C1440E / city #FFC857
       neutral tints (max 2): grid #16202E / shadow #02040A -->
  <defs>
    <linearGradient id="v7night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02040A" stop-opacity="0"/>
      <stop offset="1" stop-color="#02040A" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="v7disc"><circle cx="250" cy="430" r="195"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#05070D"/>

  <!-- header -->
  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F7FA">EARTH SYSTEMS — COLOUR TOKEN BOARD</text>
  <text x="40" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7FD4FF">8 fixed tokens · 2 neutral tints · contrast proven, not decorated</text>

  <!-- ======== Earth disc: 390 px across, core palette only ======== -->
  <g>
    <circle cx="250" cy="430" r="203" fill="none" stroke="#7FD4FF" stroke-width="2" opacity="0.16"/>
    <circle cx="250" cy="430" r="195" fill="#0B3D91"/>
    <g clip-path="url(#v7disc)">
      <!-- land masses -->
      <path d="M255 315 C 285 295 330 295 360 320 C 380 338 370 360 350 362 C 330 364 305 355 285 340 C 268 330 250 328 255 315 Z" fill="#1F6F43"/>
      <path d="M270 335 C 250 350 235 375 245 400 C 250 430 240 470 265 510 C 280 540 300 545 310 520 C 322 490 330 460 322 430 C 318 400 300 375 295 350 C 290 335 278 330 270 335 Z" fill="#1F6F43"/>
      <path d="M148 350 C 165 340 180 348 182 370 C 184 392 178 405 186 428 C 192 455 182 480 172 500 C 165 480 172 460 164 436 C 156 412 146 392 148 372 Z" fill="#1F6F43"/>
      <path d="M330 500 C 342 494 356 498 358 512 C 358 524 346 530 334 526 C 324 520 322 505 330 500 Z" fill="#1F6F43"/>
      <ellipse cx="270" cy="386" rx="36" ry="15" fill="#D9B26A" opacity="0.85"/>
      <!-- cryosphere caps -->
      <ellipse cx="250" cy="248" rx="115" ry="24" fill="#F2F7FA" opacity="0.9"/>
      <ellipse cx="250" cy="612" rx="105" ry="22" fill="#F2F7FA" opacity="0.85"/>
      <!-- cloud swirls -->
      <path d="M180 350 Q 230 328 292 342" fill="none" stroke="#F2F7FA" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <path d="M300 470 Q 350 455 396 470" fill="none" stroke="#F2F7FA" stroke-width="4" stroke-linecap="round" opacity="0.38"/>
      <path d="M140 462 Q 190 447 240 456" fill="none" stroke="#F2F7FA" stroke-width="4.5" stroke-linecap="round" opacity="0.32"/>
      <path d="M330 300 Q 362 320 340 352" fill="none" stroke="#7FD4FF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
      <path d="M205 545 Q 250 528 300 540" fill="none" stroke="#F2F7FA" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>
      <!-- day/night terminator: night falls on the right -->
      <rect x="250" y="235" width="196" height="392" fill="url(#v7night)"/>
      <!-- city lights on the night side -->
      <circle cx="300" cy="420" r="2.6" fill="#FFC857" opacity="0.9"/>
      <circle cx="318" cy="448" r="1.8" fill="#FFC857" opacity="0.85"/>
      <circle cx="338" cy="404" r="2" fill="#FFC857" opacity="0.8"/>
      <circle cx="296" cy="466" r="1.5" fill="#FFC857" opacity="0.8"/>
    </g>
    <circle cx="250" cy="430" r="195" fill="none" stroke="#7FD4FF" stroke-width="5" opacity="0.3"/>
    <text x="250" y="658" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7FD4FF" text-anchor="middle">disc rendered from core tokens only: day side / night side meet at the terminator</text>
  </g>

  <!-- ======== eight swatch cards ======== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g>
      <rect x="590" y="100" width="245" height="76" fill="#16202E"/>
      <rect x="590" y="100" width="44" height="76" fill="#05070D" stroke="#16202E"/>
      <text x="646" y="122" font-size="15" font-weight="700" fill="#F2F7FA">void</text>
      <text x="716" y="122" font-size="13" fill="#7FD4FF">#05070D</text>
      <text x="646" y="146" font-size="11.5" fill="#F2F7FA">Base canvas &amp; space void.</text>
      <text x="646" y="164" font-size="11.5" fill="#7FD4FF">Never a text colour on mid fills.</text>
    </g>
    <g>
      <rect x="880" y="100" width="245" height="76" fill="#16202E"/>
      <rect x="880" y="100" width="44" height="76" fill="#0B3D91"/>
      <text x="936" y="122" font-size="15" font-weight="700" fill="#F2F7FA">ocean</text>
      <text x="1012" y="122" font-size="13" fill="#7FD4FF">#0B3D91</text>
      <text x="936" y="146" font-size="11.5" fill="#F2F7FA">Deep-water &amp; data fills ≥2:1 on void.</text>
      <text x="936" y="164" font-size="11.5" fill="#7FD4FF">No hairline strokes on void.</text>
    </g>
    <g>
      <rect x="590" y="190" width="245" height="76" fill="#16202E"/>
      <rect x="590" y="190" width="44" height="76" fill="#7FD4FF"/>
      <text x="646" y="212" font-size="15" font-weight="700" fill="#F2F7FA">atmosphere</text>
      <text x="746" y="212" font-size="13" fill="#7FD4FF">#7FD4FF</text>
      <text x="646" y="236" font-size="11.5" fill="#F2F7FA">Links &amp; accents on void/ocean (6.11:1 on ocean).</text>
      <text x="646" y="254" font-size="11.5" fill="#7FD4FF">Never a large fill behind ice text.</text>
    </g>
    <g>
      <rect x="880" y="190" width="245" height="76" fill="#16202E"/>
      <rect x="880" y="190" width="44" height="76" fill="#1F6F43"/>
      <text x="936" y="212" font-size="15" font-weight="700" fill="#F2F7FA">forest</text>
      <text x="1006" y="212" font-size="13" fill="#7FD4FF">#1F6F43</text>
      <text x="936" y="236" font-size="11.5" fill="#F2F7FA">Biosphere fills only.</text>
      <text x="936" y="254" font-size="11.5" fill="#7FD4FF">Fails as a text carrier (3.28:1 on void).</text>
    </g>
    <g>
      <rect x="590" y="280" width="245" height="76" fill="#16202E"/>
      <rect x="590" y="280" width="44" height="76" fill="#D9B26A"/>
      <text x="646" y="302" font-size="15" font-weight="700" fill="#F2F7FA">sand</text>
      <text x="716" y="302" font-size="13" fill="#7FD4FF">#D9B26A</text>
      <text x="646" y="326" font-size="11.5" fill="#F2F7FA">Lithosphere fills; AAA text on void (10.09:1).</text>
      <text x="646" y="344" font-size="11.5" fill="#7FD4FF">Never purple-adjacent pairings.</text>
    </g>
    <g>
      <rect x="880" y="280" width="245" height="76" fill="#16202E"/>
      <rect x="880" y="280" width="44" height="76" fill="#F2F7FA"/>
      <text x="936" y="302" font-size="15" font-weight="700" fill="#F2F7FA">ice</text>
      <text x="990" y="302" font-size="13" fill="#7FD4FF">#F2F7FA</text>
      <text x="936" y="326" font-size="11.5" fill="#F2F7FA">Primary text; AAA on void (18.66:1).</text>
      <text x="936" y="344" font-size="11.5" fill="#7FD4FF">Cryosphere fills &amp; cloud tops.</text>
    </g>
    <g>
      <rect x="590" y="370" width="245" height="76" fill="#16202E"/>
      <rect x="590" y="370" width="44" height="76" fill="#C1440E"/>
      <text x="646" y="392" font-size="15" font-weight="700" fill="#F2F7FA">magma</text>
      <text x="720" y="392" font-size="13" fill="#7FD4FF">#C1440E</text>
      <text x="646" y="416" font-size="11.5" fill="#F2F7FA">Heat &amp; alert accents only.</text>
      <text x="646" y="434" font-size="11.5" fill="#7FD4FF">Never body text on void (3.93:1 — fails).</text>
    </g>
    <g>
      <rect x="880" y="370" width="245" height="76" fill="#16202E"/>
      <rect x="880" y="370" width="44" height="76" fill="#FFC857"/>
      <text x="936" y="392" font-size="15" font-weight="700" fill="#F2F7FA">city</text>
      <text x="1006" y="392" font-size="13" fill="#7FD4FF">#FFC857</text>
      <text x="936" y="416" font-size="11.5" fill="#F2F7FA">Human-light accents; AAA on void (13.09:1).</text>
      <text x="936" y="434" font-size="11.5" fill="#7FD4FF">Never for large water fills.</text>
    </g>
  </g>

  <!-- ======== WCAG 2.1 contrast block (ratios recomputed from relative luminance) ======== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="690" font-size="15" font-weight="700" fill="#F2F7FA">WCAG 2.1 CONTRAST PROOFS</text>
    <text x="40" y="710" font-size="11.5" fill="#7FD4FF">L = 0.2126·R + 0.7152·G + 0.0722·B (sRGB-linearised per channel) · ratio = (L1+0.05)/(L2+0.05)</text>
    <g font-size="12.5">
      <rect x="40" y="722" width="26" height="18" fill="#05070D"/><text x="49" y="735.5" font-size="10" font-weight="700" fill="#F2F7FA">ice</text>
      <text x="80" y="736" font-weight="700" fill="#F2F7FA">ice #F2F7FA on void #05070D — 18.66 : 1 — AAA</text>
      <text x="80" y="752" font-size="11" fill="#7FD4FF">L(ice)=0.9230 · L(void)=0.00213 · (0.9230+0.05)/(0.00213+0.05)=18.66</text>
    </g>
    <g font-size="12.5">
      <rect x="40" y="762" width="26" height="18" fill="#D9B26A"/>
      <text x="80" y="776" font-weight="700" fill="#F2F7FA">sand #D9B26A on void #05070D — 10.09 : 1 — AAA</text>
      <text x="80" y="792" font-size="11" fill="#7FD4FF">L(sand)=0.4763 · (0.4763+0.05)/(0.05213)=10.09</text>
    </g>
    <g font-size="12.5">
      <rect x="300" y="722" width="26" height="18" fill="#0B3D91"/><text x="306" y="734" font-size="9" fill="#7FD4FF">atm</text>
      <text x="340" y="736" font-weight="700" fill="#F2F7FA">atmosphere #7FD4FF on ocean #0B3D91 — 6.11 : 1 — AA</text>
      <text x="340" y="752" font-size="11" fill="#7FD4FF">L(atmo)=0.5885 · L(ocean)=0.0545 · (0.6385)/(0.10454)=6.11</text>
    </g>
    <g font-size="12">
      <rect x="300" y="762" width="26" height="18" fill="#FFC857" opacity="0.9"/>
      <text x="340" y="776" fill="#F2F7FA">city #FFC857 on void — 13.09 : 1 (AAA) · magma on void = 3.93:1 (AAA large only)</text>
    </g>
  </g>

  <!-- ======== 60-30-10 usage bar (sums to 100) ======== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    <text x="590" y="480" font-weight="700" fill="#F2F7FA">60 / 30 / 10 USAGE</text>
    <rect x="590" y="490" width="354" height="26" fill="#05070D" stroke="#16202E"/>
    <rect x="944" y="490" width="177" height="26" fill="#0B3D91"/>
    <rect x="1121" y="490" width="41" height="26" fill="#7FD4FF"/>
    <rect x="1162" y="490" width="22" height="26" fill="#FFC857"/>
    <text x="760" y="507" fill="#F2F7FA" text-anchor="middle">60% void</text>
    <text x="1030" y="507" fill="#F2F7FA" text-anchor="middle">30% ocean</text>
    <text x="1121" y="484" fill="#7FD4FF" text-anchor="middle">7%</text>
    <text x="1174" y="484" fill="#FFC857" text-anchor="middle">3%</text>
    <text x="590" y="534" font-size="11.5" fill="#7FD4FF">60 + 30 + 7 + 3 = 100 — void carries structure, ocean carries the world, light tokens carry signal</text>
  </g>

  <!-- ======== typographic hierarchy (system fonts only) ======== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="590" y="570" font-size="11" fill="#7FD4FF" font-weight="700">DISPLAY</text>
    <text x="590" y="596" font-size="26" font-weight="700" fill="#F2F7FA">EARTH SYSTEMS 02</text>
    <text x="790" y="570" font-size="11" fill="#7FD4FF" font-weight="700">BODY</text>
    <text x="790" y="592" font-size="14" fill="#F2F7FA">System font stack — Segoe UI / Helvetica / Arial.</text>
    <text x="790" y="612" font-size="12.5" fill="#7FD4FF">Body copy reads at 4.5:1 minimum, always on void.</text>
    <text x="590" y="640" font-size="11" fill="#7FD4FF">CAPTION — 11px muted grids, tints, and audit strings like this one.</text>
  </g>
</svg>
