<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NKB-1 // T-MINUS — 60 s loop</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #03050a; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  #wrap { width: 100%; max-width: 1280px; }
  canvas#stage { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #03050a; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage" width="1280" height="720" role="img"
          aria-label="A 60-second looping motion piece: title card, countdown, ignition and ascent, then orbit with credits."></canvas>
  <p class="sr">Motion piece. When the operating system requests reduced motion a static poster frame is shown instead.</p>
</div>
<script>
'use strict';
/* ===========================================================================
   NKB-1 // T-MINUS  —  single file, zero dependencies, exact 60.000 s loop
   ---------------------------------------------------------------------------
   BEATS (seconds, loop period 60.000, seamless at the seam)
     0-8s   TITLE              "NKB-1 // T-MINUS" card with subtle build-up
     8-25s  COUNTDOWN          10 -> 0 readout + animated telemetry bars
     25-40s IGNITION & ASCENT  flame particles, camera shake, receding ground
     40-60s ORBIT & CREDITS    earth curvature drifts past, satellite, credits
   SEAM LOGIC: every layer is wrapped in an alpha envelope that is 0 at both
   t=0 and t=60, and every oscillator has an integer number of cycles per
   60 s, so the rendered frame at t=0 and t=60 is pixel-identical.
   Determinism: one mulberry32 stream, seed 1889; no Math.random anywhere.
   =========================================================================== */

const W = 1280, H = 720;
const TAU = Math.PI * 2;
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');

/* ---------- deterministic PRNG (mulberry32, seed 1889) ------------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(1889);

/* ---------- static tables, built once ------------------------------------ */
const STARS = [];
for (let i = 0; i < 240; i++) {
  STARS.push({
    x: rnd() * W, y: rnd() * H * 0.98,
    r: 0.5 + rnd() * 1.5,
    a: 0.20 + rnd() * 0.75,
    p: 0.3 + rnd() * 1.6,
    ph: rnd() * TAU,
    hz: 1 + Math.floor(rnd() * 3)          /* integer => 60 s periodic */
  });
}
const PUFFS = [];
for (let i = 0; i < 14; i++) {
  PUFFS.push({ x: (rnd() * 2 - 1) * 300, dy: rnd() * 40, r: 40 + rnd() * 90, d: 0.6 + rnd() * 0.9 });
}
const PARTS = [];
for (let i = 0; i < 210; i++) {
  PARTS.push({ off: rnd(), spread: rnd() * 2 - 1, sp: 0.55 + rnd() * 0.9, ph: rnd() * TAU, sz: 1.6 + rnd() * 3.4 });
}

/* ---------- timing helpers (loop-safe) ----------------------------------- */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const env = (t, a, b, c, d) => ramp(t, a, b) * (1 - ramp(t, c, d));

/* ---------- canvas / DPI ------------------------------------------------- */
function fitBackingStore() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  stage.width = Math.round(W * dpr);
  stage.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------- small type helper: manual letter tracking ------------------- */
function drawTracked(text, cx, y, ls, color) {
  const chars = Array.from(text);
  const w = [];
  let total = -ls;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const ch of chars) { const m = ctx.measureText(ch).width; w.push(m); total += m + ls; }
  let x = cx - total / 2;
  ctx.fillStyle = color;
  for (let i = 0; i < chars.length; i++) { ctx.fillText(chars[i], x, y); x += w[i] + ls; }
}

/* =========================== LAYERS ===================================== */

/* constant deep-space plate: identical on every frame, so seam-safe */
function drawSpace() {
  const g = ctx.createRadialGradient(640, 300, 40, 640, 300, 980);
  g.addColorStop(0, '#0b1422');
  g.addColorStop(0.55, '#070c16');
  g.addColorStop(1, '#03050a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const n1 = ctx.createRadialGradient(250, 190, 10, 250, 190, 420);
  n1.addColorStop(0, 'rgba(41,64,120,0.18)');
  n1.addColorStop(1, 'rgba(41,64,120,0)');
  ctx.fillStyle = n1; ctx.fillRect(0, 0, W, H);
  const n2 = ctx.createRadialGradient(1010, 520, 10, 1010, 520, 460);
  n2.addColorStop(0, 'rgba(90,40,80,0.14)');
  n2.addColorStop(1, 'rgba(90,40,80,0)');
  ctx.fillStyle = n2; ctx.fillRect(0, 0, W, H);
}

/* star field: parallax + twinkle, both integer-cycle periodic over 60 s */
function drawStars(t) {
  const dx = 5 * Math.sin(TAU * t / 60);
  const dy = 3 * Math.cos(TAU * t / 60);
  for (let i = 0; i < STARS.length; i++) {
    const s = STARS[i];
    const tw = 0.55 + 0.45 * Math.sin(TAU * (t / 60) * s.hz + s.ph);
    ctx.globalAlpha = clamp01(s.a * tw);
    ctx.fillStyle = '#dfe9f5';
    ctx.beginPath(); ctx.arc(s.x + dx * s.p, s.y + dy * s.p, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const v = ctx.createRadialGradient(640, 360, 320, 640, 360, 800);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ---- 0-8 s : TITLE ------------------------------------------------------ */
function drawTitle(t) {
  const a = env(t, 0.0, 1.4, 6.5, 8.0);
  if (a <= 0.002) return;
  ctx.save();
  ctx.globalAlpha = a;

  /* subtle build-up: one slow light sweep across the card */
  const sx = -320 + (W + 640) * ramp(t, 0.6, 5.6);
  const sweep = ctx.createLinearGradient(sx - 190, 0, sx + 190, 0);
  sweep.addColorStop(0, 'rgba(140,200,255,0)');
  sweep.addColorStop(0.5, 'rgba(140,200,255,0.16)');
  sweep.addColorStop(1, 'rgba(140,200,255,0)');
  ctx.fillStyle = sweep; ctx.fillRect(0, 0, W, H);

  ctx.font = '800 60px "Segoe UI", Helvetica, Arial, sans-serif';
  drawTracked('NKB-1 // T-MINUS', 640, 336, 3 + 13 * ramp(t, 0.3, 4.4), '#eef4fb');

  const rw = 120 + 520 * ramp(t, 1.6, 4.6);
  const rg = ctx.createLinearGradient(640 - rw / 2, 0, 640 + rw / 2, 0);
  rg.addColorStop(0, 'rgba(127,212,255,0)');
  rg.addColorStop(0.5, 'rgba(127,212,255,0.95)');
  rg.addColorStop(1, 'rgba(127,212,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(640 - rw / 2, 386, rw, 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 15px Consolas, "Courier New", monospace';
  ctx.fillStyle = 'rgba(180,205,230,' + (0.9 * ramp(t, 1.8, 3.6)) + ')';
  ctx.fillText('MISSION CONTROL \u00B7 MOTION PIECE \u00B7 EXACTLY 60.000 s \u00B7 SEAMLESS LOOP', 640, 414);
  ctx.fillText('NIKBENCH v3.0 / VISUAL CRAFT', 640, 440);

  for (let i = 0; i < 9; i++) {
    ctx.globalAlpha = a * ramp(t, 0.4 + i * 0.30, 0.9 + i * 0.30);
    ctx.fillStyle = '#7fd4ff';
    ctx.fillRect(640 - 120 + i * 30, 472, 12, 3);
  }
  ctx.restore();
}

/* ---- 8-25 s : COUNTDOWN ------------------------------------------------- */
function drawCountdown(t) {
  const a = env(t, 8.0, 8.9, 24.2, 25.0);
  if (a <= 0.002) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textBaseline = 'middle';

  ctx.font = '700 15px Consolas, "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7fd4ff';
  ctx.fillText('T-MINUS', 640, 146);

  /* 10 -> 0 numerals, compressed into 17 s (1.7 s per count) */
  const idx = Math.min(10, Math.floor((t - 8) / 1.7));
  const n = 10 - idx;
  const f = ((t - 8) % 1.7) / 1.7;
  const sc = 1 + 0.30 * Math.pow(1 - f, 2.4);
  ctx.save();
  ctx.translate(640, 320); ctx.scale(sc, sc);
  ctx.font = '800 176px "Segoe UI", Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = a * (1 - 0.40 * Math.pow(f, 5));
  ctx.fillStyle = n <= 3 ? '#ff9a4d' : '#eef4fb';
  ctx.fillText(String(n), 0, 0);
  ctx.restore();

  /* sweep ring around the numeral */
  ctx.save();
  ctx.translate(640, 320);
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(127,212,255,0.26)';
  ctx.beginPath(); ctx.arc(0, 0, 132, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 132, -Math.PI / 2, -Math.PI / 2 + TAU * ((t - 8) / 17)); ctx.stroke();
  ctx.restore();

  /* telemetry bars, left */
  const bars = [['LOX', 17, 0.62], ['RP-1', 39, 0.78], ['HYD', 59, 0.50], ['NAV', 77, 0.90]];
  ctx.font = '600 13px Consolas, "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let i = 0; i < bars.length; i++) {
    const label = bars[i][0], ph = bars[i][1], base = bars[i][2];
    const y = 232 + i * 46;
    const wobble = 0.34 * Math.sin(TAU * (t / 60) * 3 + ph / 16) + 0.06 * Math.sin(TAU * (t / 60) * 7 + ph / 9);
    const v = clamp01(base + wobble);
    ctx.fillStyle = 'rgba(180,205,230,0.85)';
    ctx.fillText(label, 96, y);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(160, y - 7, 300, 14);
    ctx.fillStyle = v > 0.92 ? '#ff9a4d' : '#7fd4ff';
    ctx.fillRect(160, y - 7, 300 * v, 14);
    ctx.strokeStyle = 'rgba(180,205,230,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(160.5, y - 6.5, 299, 13);
    ctx.fillStyle = 'rgba(180,205,230,0.9)';
    ctx.fillText((v * 100).toFixed(1) + '%', 474, y);
  }

  /* system readouts, right */
  const lines = [['GUIDANCE', 'NOMINAL'], ['TELEMETRY', 'LOCKED'], ['RANGE SAFETY', 'GO'], ['PAD 39-N', 'CLEAR']];
  for (let i = 0; i < lines.length; i++) {
    const y = 232 + i * 46;
    ctx.font = '600 13px Consolas, "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(180,205,230,0.62)';
    ctx.fillText(lines[i][0], 820, y);
    ctx.font = '700 13px Consolas, "Courier New", monospace';
    ctx.fillStyle = i === 3 ? '#d98a2b' : '#7fd4ff';
    ctx.fillText(lines[i][1], 962, y);
  }

  ctx.textAlign = 'center';
  ctx.font = '600 13px Consolas, "Courier New", monospace';
  ctx.fillStyle = 'rgba(180,205,230,0.5)';
  ctx.fillText('HOLD-DOWN CLAMPS RELEASED \u00B7 GIMBAL CHECK COMPLETE \u00B7 RANGE CLEAR', 640, 556);
  ctx.restore();
}

/* ---- 25-40 s : IGNITION & ASCENT --------------------------------------- */
function drawAscent(t) {
  const a = env(t, 25.0, 25.7, 39.4, 40.2);
  if (a <= 0.002) return;

  const shake = (2.2 + 12 * Math.pow(1 - ramp(t, 25, 30.5), 2)) * a;
  ctx.save();
  ctx.globalAlpha = a;
  /* camera shake, scaled slightly up so no edge is exposed */
  ctx.translate(640, 360); ctx.scale(1.03, 1.03);
  ctx.translate(-640 + shake * Math.sin(t * 41.3), -360 + shake * Math.cos(t * 33.7));

  /* engine heat washing the lower frame */
  const skyA = ramp(t, 25.0, 29.0);
  const sky = ctx.createLinearGradient(0, 200, 0, H);
  sky.addColorStop(0, 'rgba(10,16,30,0)');
  sky.addColorStop(0.55, 'rgba(120,50,18,' + (0.30 * skyA) + ')');
  sky.addColorStop(1, 'rgba(255,146,64,' + (0.72 * skyA) + ')');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  /* receding ground plane */
  const gy = 620 + 900 * ramp(t, 26.5, 36.0);
  const gA = (1 - ramp(t, 35.0, 40.0)) * a;
  if (gy < H + 300 && gA > 0.01) {
    ctx.save();
    ctx.globalAlpha = gA;
    ctx.strokeStyle = 'rgba(255,170,110,0.55)';
    ctx.lineWidth = 1.5;
    for (let i = -9; i <= 9; i++) {
      ctx.beginPath();
      ctx.moveTo(640 + i * 260, Math.min(H + 400, gy + 700));
      ctx.lineTo(640 + i * 34, gy);
      ctx.stroke();
    }
    for (let k = 0; k < 7; k++) {
      const yy = gy + Math.pow(k, 1.9) * 11;
      if (yy > H + 40) break;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }
    ctx.restore();
  }

  /* vehicle geometry: rises, then shrinks as it recedes */
  const ry = 560 - 380 * ramp(t, 26.0, 40.0);
  const rs = 1 - 0.50 * ramp(t, 30.0, 40.0);
  const nozzleY = ry + 66 * rs;

  /* exhaust plume (behind the body) */
  ctx.save();
  ctx.translate(640, ry); ctx.scale(rs, rs);
  const fl = (1 + 0.22 * Math.sin(t * 19.0)) * (0.55 + 0.75 * ramp(t, 25.0, 29.0));
  const plume = ctx.createLinearGradient(0, 60, 0, 70 + 320 * fl);
  plume.addColorStop(0, 'rgba(255,246,214,0.98)');
  plume.addColorStop(0.25, 'rgba(255,196,96,0.92)');
  plume.addColorStop(0.60, 'rgba(255,116,40,0.62)');
  plume.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = plume;
  ctx.beginPath();
  ctx.moveTo(-26, 62);
  ctx.bezierCurveTo(-46, 120 * fl, -22, 240 * fl, 0, 70 + 320 * fl);
  ctx.bezierCurveTo(22, 240 * fl, 46, 120 * fl, 26, 62);
  ctx.closePath(); ctx.fill();

  /* body */
  ctx.fillStyle = '#eef4fb';
  ctx.beginPath();
  ctx.moveTo(0, -118);
  ctx.bezierCurveTo(20, -96, 26, -40, 26, 30);
  ctx.lineTo(26, 66); ctx.lineTo(-26, 66); ctx.lineTo(-26, 30);
  ctx.bezierCurveTo(-26, -40, -20, -96, 0, -118);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(20,28,43,0.22)';
  ctx.beginPath();
  ctx.moveTo(0, -118);
  ctx.bezierCurveTo(20, -96, 26, -40, 26, 30);
  ctx.lineTo(26, 66); ctx.lineTo(0, 66);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#b9c6d6'; ctx.fillRect(-26, 8, 52, 7);
  ctx.fillStyle = '#8fa3b8'; ctx.fillRect(-26, 54, 52, 8);
  ctx.fillStyle = '#7fd4ff';
  ctx.beginPath(); ctx.arc(0, -46, 9, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8fa3b8'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#c9d6e4';
  ctx.beginPath(); ctx.moveTo(-26, 20); ctx.lineTo(-58, 74); ctx.lineTo(-26, 66); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(26, 20); ctx.lineTo(58, 74); ctx.lineTo(26, 66); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* flame particles: continuous nozzle emission via a sawtooth lifetime */
  ctx.save();
  for (let i = 0; i < PARTS.length; i++) {
    const q = PARTS[i];
    const CYC = 1.05;
    let raw = (t - (25.0 + q.off * 2.4)) % CYC;
    if (raw < 0) raw += CYC;
    const age = raw / CYC;
    if (age <= 0.02) continue;
    const px = 640 + q.spread * age * 150 * rs + Math.sin(age * 22 + q.ph) * 7;
    const py = nozzleY + age * 430 * q.sp * rs;
    const pr = (q.sz + age * 11) * rs;
    const heat = clamp01(1 - age * 2.1);
    ctx.globalAlpha = a * (1 - age) * (1 - age);
    ctx.fillStyle = 'rgb(255,' + Math.round(120 + 130 * heat) + ',' + Math.round(30 + 150 * heat) + ')';
    ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* pad smoke, early only */
  const smA = ramp(t, 25.0, 26.2) * (1 - ramp(t, 30.5, 34.5)) * a;
  if (smA > 0.01) {
    ctx.save();
    ctx.globalAlpha = smA;
    for (let i = 0; i < PUFFS.length; i++) {
      const p = PUFFS[i];
      const grow = ramp(t, 25.0, 33.0);
      const x = 640 + p.x * (0.5 + 1.9 * grow);
      const y = 622 + p.dy + 200 * grow * p.d;
      const r = p.r * (0.5 + 1.4 * grow);
      const sg = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
      sg.addColorStop(0, 'rgba(196,178,160,0.20)');
      sg.addColorStop(1, 'rgba(196,178,160,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  /* velocity streaks, mid ascent */
  const stA = ramp(t, 29.0, 31.0) * (1 - ramp(t, 38.0, 40.0)) * a;
  if (stA > 0.01) {
    ctx.save();
    ctx.globalAlpha = stA * 0.5;
    ctx.strokeStyle = 'rgba(190,215,240,0.8)'; ctx.lineWidth = 1.4;
    for (let k = 0; k < 70; k++) {
      const x = (k * 173.7) % W;
      const y = ((t * 340 + k * 211) % (H + 420)) - 210;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 42 + (k % 5) * 12); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ---- 40-60 s : ORBIT & CREDITS ----------------------------------------- */
function drawOrbit(t) {
  const a = env(t, 40.0, 41.4, 58.0, 60.0);
  if (a <= 0.002) return;
  ctx.save();
  ctx.globalAlpha = a;

  /* earth limb: big circle whose top edge sits near y = 560 and drifts left */
  const drift = ramp(t, 40.0, 58.5);
  const cx = 640 - 430 * drift;
  const cy = 1360;
  const R = 800;

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();

  const og = ctx.createRadialGradient(cx, cy - R * 0.9, 60, cx, cy, R);
  og.addColorStop(0, '#12539f');
  og.addColorStop(0.35, '#0b3d91');
  og.addColorStop(0.80, '#062b6b');
  og.addColorStop(1, '#02132f');
  ctx.fillStyle = og; ctx.fillRect(0, 0, W, H);

  /* land masses (three recognisable ones, plus two partial) */
  const blobs = [
    [0.10, 0.06, 190, 96, -0.25],
    [0.32, 0.13, 120, 74, 0.50],
    [-0.26, 0.10, 150, 82, 0.90],
    [0.55, 0.20, 96, 62, -0.60],
    [-0.55, 0.22, 118, 70, 0.20],
    [0.00, 0.30, 220, 60, 1.10]
  ];
  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    ctx.save();
    ctx.translate(cx + b[0] * R, cy - R + b[1] * R);
    ctx.rotate(b[4]);
    ctx.fillStyle = '#1f6f43';
    ctx.beginPath(); ctx.ellipse(0, 0, b[2], b[3], 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d9b26a';
    ctx.beginPath(); ctx.ellipse(b[2] * 0.35, b[3] * 0.25, b[2] * 0.42, b[3] * 0.42, 0.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(242,247,250,0.85)';
  ctx.beginPath(); ctx.ellipse(cx - 0.10 * R, cy - R + 0.02 * R, 300, 44, 0, 0, TAU); ctx.fill();

  /* cloud swirls, drifting a little faster than the globe */
  const cd = drift * 90;
  const clouds = [[0.06, -0.02, 120, 34], [0.24, 0.05, 90, 26], [-0.20, 0.03, 110, 30],
                  [0.42, 0.12, 80, 24], [-0.44, 0.14, 96, 28], [0.00, 0.22, 150, 30]];
  ctx.fillStyle = 'rgba(242,247,250,0.30)';
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    const bx = cx + c[0] * R + cd, by = cy - R + c[1] * R;
    ctx.beginPath(); ctx.ellipse(bx, by, c[2], c[3], 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + c[2] * 0.5, by + c[3] * 0.4, c[2] * 0.6, c[3] * 0.7, 0, 0, TAU); ctx.fill();
  }

  /* day/night terminator */
  const tg = ctx.createLinearGradient(cx - R, 0, cx + R * 0.45, 0);
  tg.addColorStop(0, 'rgba(3,6,14,0.92)');
  tg.addColorStop(0.45, 'rgba(3,6,14,0.55)');
  tg.addColorStop(1, 'rgba(3,6,14,0)');
  ctx.fillStyle = tg; ctx.fillRect(0, 0, W, H);

  /* city lights on the night side (2 cycles / 60 s => seam-safe) */
  for (let i = 0; i < 26; i++) {
    const u = (i * 0.618) % 1;
    const x = cx - R * 0.75 + u * R * 0.9;
    const y = cy - R + (0.04 + ((i * 0.37) % 0.34)) * R;
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(TAU * (t / 60) * 2 + i));
    ctx.globalAlpha = a * 0.85 * tw;
    ctx.fillStyle = '#ffc857';
    ctx.beginPath(); ctx.arc(x, y, 1.4 + (i % 3) * 0.7, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = a;
  ctx.restore();

  /* atmosphere rim glow */
  ctx.save();
  ctx.globalAlpha = a * 0.75;
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(127,212,255,0.30)';
  ctx.beginPath(); ctx.arc(cx, cy, R + 4, 0, TAU); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(200,240,255,0.75)';
  ctx.beginPath(); ctx.arc(cx, cy, R + 1, 0, TAU); ctx.stroke();
  ctx.restore();

  /* satellite pass */
  const sp = ramp(t, 41.5, 56.0);
  const sA = ramp(t, 41.5, 43.0) * (1 - ramp(t, 55.0, 57.5));
  if (sA > 0.01) {
    ctx.save();
    ctx.globalAlpha = a * sA;
    ctx.translate(-140 + (W + 280) * sp, 150 + 34 * Math.sin(Math.PI * sp));
    ctx.rotate(-0.16 + 0.32 * sp);
    ctx.fillStyle = '#12406f';
    ctx.fillRect(-96, -16, 66, 32);
    ctx.fillRect(30, -16, 66, 32);
    ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(-96 + i * 16.5, -16); ctx.lineTo(-96 + i * 16.5, 16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(30 + i * 16.5, -16); ctx.lineTo(30 + i * 16.5, 16); ctx.stroke();
    }
    ctx.fillStyle = '#dfe9f5'; ctx.fillRect(-26, -20, 52, 40);
    ctx.fillStyle = '#8fa3b8'; ctx.fillRect(-26, -20, 52, 8);
    const blink = Math.sin(TAU * (t / 60) * 4) > 0 ? 1 : 0.15;
    ctx.globalAlpha = a * sA * blink;
    ctx.fillStyle = '#ffc857';
    ctx.beginPath(); ctx.arc(0, 22, 4.5, 0, TAU); ctx.fill();
    ctx.globalAlpha = a * sA;
    ctx.strokeStyle = '#dfe9f5'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -40); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -42, 3, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  /* credits: fade up in sequence, dissolve well before the seam */
  const credits = [
    ['NKB-1  //  LIFTOFF', 43.6, 22, '#eef4fb'],
    ['a 60-second looping motion piece', 45.0, 14, '#b4cde6'],
    ['timeline-driven \u00B7 zero external assets', 46.2, 14, '#b4cde6'],
    ['exactly 60.000 s \u00B7 seamless at the seam', 47.4, 14, '#b4cde6'],
    ['direction & code \u2014 big-pickle', 48.8, 15, '#7fd4ff'],
    ['thanks for watching', 50.6, 14, '#b4cde6']
  ];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < credits.length; i++) {
    const c = credits[i];
    const ca = env(t, c[1], c[1] + 0.9, 56.4, 59.0);
    if (ca <= 0.002) continue;
    ctx.globalAlpha = a * ca;
    ctx.fillStyle = c[3];
    ctx.font = '700 ' + c[2] + 'px "Segoe UI", Helvetica, Arial, sans-serif';
    ctx.fillText(c[0], 640, 250 + i * 38);
  }

  const capA = env(t, 52.0, 53.0, 58.0, 60.0);
  if (capA > 0.002) {
    ctx.globalAlpha = a * capA;
    ctx.font = '600 13px Consolas, "Courier New", monospace';
    ctx.fillStyle = '#8fb6d8';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('MISSION ELAPSED TIME \u00B7 ORBIT ACHIEVED \u00B7 RETURNING TO T+00:00', 640, 492);
  }
  ctx.restore();
}

/* ---- HUD: mission clock + current beat --------------------------------- */
function beatName(t) {
  if (t < 8) return 'TITLE';
  if (t < 25) return 'COUNTDOWN';
  if (t < 40) return 'IGNITION / ASCENT';
  return 'ORBIT / CREDITS';
}
function drawClock(t, beat) {
  const tenth = Math.floor((t % 60) * 10) / 10;
  const ss = (tenth < 10 ? '0' : '') + tenth.toFixed(1);
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.font = '600 14px Consolas, "Courier New", monospace';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#8fb6d8';
  ctx.textAlign = 'left';
  ctx.fillText('T+' + ss, 28, 40);
  ctx.textAlign = 'right';
  ctx.fillText(beat, W - 28, 40);
  ctx.restore();
}

/* ---- master render ----------------------------------------------------- */
function render(t) {
  drawSpace();
  drawStars(t);
  drawTitle(t);
  drawCountdown(t);
  drawAscent(t);
  drawOrbit(t);
  drawVignette();
  drawClock(t, beatName(t));
}

/* ---- static poster keyframe for prefers-reduced-motion ----------------- */
function drawPoster() {
  drawSpace();
  drawStars(0);
  drawAscent(31.0);
  drawOrbit(45.0);
  drawVignette();
  ctx.save();
  ctx.font = '800 46px "Segoe UI", Helvetica, Arial, sans-serif';
  drawTracked('NKB-1 // T-MINUS', 640, 112, 9, '#eef4fb');
  ctx.font = '600 14px Consolas, "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8fb6d8';
  ctx.fillText('STATIC POSTER \u00B7 prefers-reduced-motion \u00B7 60 s loop', 640, 160);
  ctx.restore();
  drawClock(27.0, 'IGNITION / ASCENT');
}

/* ---- driver ------------------------------------------------------------ */
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;
let rafId = 0;
let startTime = performance.now();

function loop(now) {
  const t = ((now - startTime) / 1000) % 60;
  render(t);
  rafId = requestAnimationFrame(loop);
}
function startLoop() {
  if (rafId) return;
  startTime = performance.now();
  rafId = requestAnimationFrame(loop);
}
function stopLoop() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
}
function applyMotionPref() {
  reduced = mq.matches;
  fitBackingStore();
  if (reduced) {
    stopLoop();
    ctx.clearRect(0, 0, W, H);
    drawPoster();
  } else {
    startLoop();
  }
}
if (typeof mq.addEventListener === 'function') mq.addEventListener('change', applyMotionPref);
else if (typeof mq.addListener === 'function') mq.addListener(applyMotionPref);
window.addEventListener('resize', function () { fitBackingStore(); if (reduced) { ctx.clearRect(0, 0, W, H); drawPoster(); } });

fitBackingStore();
applyMotionPref();
</script>
</body>
</html>
