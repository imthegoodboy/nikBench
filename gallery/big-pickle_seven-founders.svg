<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Infographic: seven founders of computing, birth years pinned to a to-scale timeline from 1800 to 2000, with lifespan bars and three influence arrows">
  <!-- palette: paper #F5F2EA, ink #141C2B, muted #6B7484, grid #D8D2C4, blue #2A5CAA (machines & computability), amber #D98A2B (languages & programming), teal #2E7D6F (information & analysis) -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6B7484"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#F5F2EA"/>

  <!-- header -->
  <text x="60" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#141C2B" letter-spacing="0.5">SEVEN FOUNDERS OF COMPUTING</text>
  <text x="60" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B7484">Birth years pinned to scale, 1800&#8211;2000 &#183; bars show lifespan (clipped at the 2000 edge)</text>

  <!-- category legend -->
  <rect x="890" y="36" width="12" height="12" rx="2.5" fill="#2A5CAA"/>
  <text x="908" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#141C2B">machines &amp; computability</text>
  <rect x="890" y="58" width="12" height="12" rx="2.5" fill="#D98A2B"/>
  <text x="908" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#141C2B">languages &amp; programming</text>
  <rect x="890" y="80" width="12" height="12" rx="2.5" fill="#2E7D6F"/>
  <text x="908" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#141C2B">information &amp; analysis</text>

  <!-- to-scale decade gridlines: year y -> x = 60 + (y-1800)*5.4 -->
  <g stroke="#D8D2C4" stroke-width="1">
    <line x1="60" y1="110" x2="60" y2="612"/>
    <line x1="168" y1="110" x2="168" y2="612"/>
    <line x1="276" y1="110" x2="276" y2="612"/>
    <line x1="384" y1="110" x2="384" y2="612"/>
    <line x1="492" y1="110" x2="492" y2="612"/>
    <line x1="600" y1="110" x2="600" y2="612"/>
    <line x1="708" y1="110" x2="708" y2="612"/>
    <line x1="816" y1="110" x2="816" y2="612"/>
    <line x1="924" y1="110" x2="924" y2="612"/>
    <line x1="1032" y1="110" x2="1032" y2="612"/>
    <line x1="1140" y1="110" x2="1140" y2="612"/>
  </g>

  <!-- lane 1: Ada Lovelace 1815-1852 (x 141 -> 341) -->
  <text x="141" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141C2B">Ada Lovelace &#183; 1815&#8211;1852</text>
  <rect x="141" y="160" width="200" height="22" rx="4" fill="#D98A2B"/>
  <text x="141" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">Note G: the first published algorithm (Analytical Engine)</text>

  <!-- lane 2: John von Neumann 1903-1957 (x 616 -> 908) -->
  <text x="616" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141C2B">John von Neumann &#183; 1903&#8211;1957</text>
  <rect x="616" y="222" width="292" height="22" rx="4" fill="#2A5CAA"/>
  <text x="616" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">Stored-program architecture (EDVAC report, 1945)</text>

  <!-- lane 3: Grace Hopper 1906-1992 (x 632 -> 1097) -->
  <text x="632" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141C2B">Grace Hopper &#183; 1906&#8211;1992</text>
  <rect x="632" y="284" width="465" height="22" rx="4" fill="#D98A2B"/>
  <text x="632" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">Compilers &amp; COBOL</text>

  <!-- lane 4: Alan Turing 1912-1954 (x 665 -> 892) -->
  <text x="665" y="338" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141C2B">Alan Turing &#183; 1912&#8211;1954</text>
  <rect x="665" y="346" width="227" height="22" rx="4" fill="#2A5CAA"/>
  <text x="665" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">Universal machine (1936)</text>

  <!-- lane 5: Claude Shannon 1916-2001 (x 686 -> clipped 1140) -->
  <text x="686" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141C2B">Claude Shannon &#183; 1916&#8211;2001</text>
  <rect x="686" y="408" width="454" height="22" rx="4" fill="#2E7D6F"/>
  <rect x="1132" y="412" width="8" height="14" fill="#F5F2EA" opacity="0.85"/>
  <path d="M1130 411 L1146 419 L1130 427 Z" fill="#2E7D6F" opacity="0.55"/>
  <text x="686" y="448" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">Information theory (1948)</text>

  <!-- lane 6: Edsger Dijkstra 1930-2002 (x 762 -> clipped 1140) -->
  <text x="762" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141C2B">Edsger Dijkstra &#183; 1930&#8211;2002</text>
  <rect x="762" y="470" width="378" height="22" rx="4" fill="#D98A2B"/>
  <rect x="1132" y="474" width="8" height="14" fill="#F5F2EA" opacity="0.85"/>
  <path d="M1130 473 L1146 481 L1130 489 Z" fill="#D98A2B" opacity="0.55"/>
  <text x="762" y="510" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">Shortest path; structured programming</text>

  <!-- lane 7: Donald Knuth b. 1938 (x 805 -> clipped 1140) -->
  <text x="805" y="524" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#141C2B">Donald Knuth &#183; b. 1938</text>
  <rect x="805" y="532" width="335" height="22" rx="4" fill="#2E7D6F"/>
  <text x="805" y="572" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">The Art of Computer Programming; analysis of algorithms</text>

  <!-- influence arrows -->
  <path d="M341 171 C 460 200 560 320 660 353" fill="none" stroke="#6B7484" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <circle cx="470" cy="245" r="10" fill="#141C2B"/>
  <text x="470" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#F5F2EA" text-anchor="middle">1</text>

  <path d="M668 348 C 580 330 560 250 620 242" fill="none" stroke="#6B7484" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <circle cx="560" cy="300" r="10" fill="#141C2B"/>
  <text x="560" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#F5F2EA" text-anchor="middle">2</text>

  <path d="M1050 492 L1050 528" fill="none" stroke="#6B7484" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <circle cx="1074" cy="510" r="10" fill="#141C2B"/>
  <text x="1074" y="514" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#F5F2EA" text-anchor="middle">3</text>

  <!-- influence key -->
  <text x="60" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#141C2B" letter-spacing="1.2">INFLUENCE</text>
  <text x="60" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#141C2B">1  Lovelace &#8594; Turing &#8212; Note G (1843) is the first published algorithm;</text>
  <text x="60" y="435" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">Turing&#8217;s 1950 paper takes up &#8220;Lady Lovelace&#8217;s objection&#8221; by name.</text>
  <text x="60" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#141C2B">2  Turing &#8594; von Neumann &#8212; the universal machine (1936) underlies the</text>
  <text x="60" y="481" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">stored-program architecture of the EDVAC report (1945).</text>
  <text x="60" y="510" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#141C2B">3  Dijkstra &#8594; Knuth &#8212; graph algorithms and structured programming</text>
  <text x="60" y="527" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">informed the analysis of algorithms (TAOCP, from 1968).</text>

  <!-- timeline axis and truthful birth pins -->
  <line x1="60" y1="612" x2="1140" y2="612" stroke="#141C2B" stroke-width="2"/>
  <g stroke="#141C2B" stroke-width="1.5">
    <line x1="60" y1="612" x2="60" y2="620"/>
    <line x1="168" y1="612" x2="168" y2="620"/>
    <line x1="276" y1="612" x2="276" y2="620"/>
    <line x1="384" y1="612" x2="384" y2="620"/>
    <line x1="492" y1="612" x2="492" y2="620"/>
    <line x1="600" y1="612" x2="600" y2="620"/>
    <line x1="708" y1="612" x2="708" y2="620"/>
    <line x1="816" y1="612" x2="816" y2="620"/>
    <line x1="924" y1="612" x2="924" y2="620"/>
    <line x1="1032" y1="612" x2="1032" y2="620"/>
    <line x1="1140" y1="612" x2="1140" y2="620"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7484" text-anchor="middle">
    <text x="60" y="636">1800</text>
    <text x="168" y="636">1820</text>
    <text x="276" y="636">1840</text>
    <text x="384" y="636">1860</text>
    <text x="492" y="636">1880</text>
    <text x="600" y="636">1900</text>
    <text x="708" y="636">1920</text>
    <text x="816" y="636">1940</text>
    <text x="924" y="636">1960</text>
    <text x="1032" y="636">1980</text>
    <text x="1140" y="636">2000</text>
  </g>
  <g fill="#141C2B">
    <circle cx="141" cy="612" r="4"/>
    <circle cx="616" cy="612" r="4"/>
    <circle cx="632" cy="612" r="4"/>
    <circle cx="665" cy="612" r="4"/>
    <circle cx="686" cy="612" r="4"/>
    <circle cx="762" cy="612" r="4"/>
    <circle cx="805" cy="612" r="4"/>
  </g>

  <text x="60" y="664" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7484">Scale: 1800 &#8594; x = 60 px, 2000 &#8594; x = 1140 px (5.4 px per year). Pins on the axis mark true birth years; lifespan bars ending at the 2000 edge (Shannon 2001, Dijkstra 2002, Knuth ongoing) are clipped there and shown with an open tip.</text>
</svg>
