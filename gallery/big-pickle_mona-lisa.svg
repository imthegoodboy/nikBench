<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="Mona Lisa, hand-authored vector portrait with sfumato shading">
  <!-- palette: sky #a9c1cb -> #e0d6b8 (haze, aerial perspective); distance #93a9b0 -> #b3bcb2 and #7d949a -> #5f7a78; water #7d9a95; rock #4a3a28 / #423525 / #382b1d / #31261a; terrace #5c5240 / #544b39; path #b0a184; skin #f3d7b0 -> #c39464, shadow #b98a5e, warm #e0b98e; hair #3d2c1c -> #1c1409; dress #3a2f21 -> #15100b; veil #241b12 with opacity; lips #b5725c / #8d5142 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c1cb"/>
      <stop offset="0.55" stop-color="#cdd5cb"/>
      <stop offset="1" stop-color="#e0d6b8"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93a9b0"/>
      <stop offset="1" stop-color="#b3bcb2"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d949a"/>
      <stop offset="1" stop-color="#5f7a78"/>
    </linearGradient>
    <radialGradient id="face" cx="0.42" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#f3d7b0"/>
      <stop offset="0.55" stop-color="#e6c195"/>
      <stop offset="1" stop-color="#c39464"/>
    </radialGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c88a6a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c88a6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f21"/>
      <stop offset="0.5" stop-color="#241c14"/>
      <stop offset="1" stop-color="#15100b"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2c1c"/>
      <stop offset="1" stop-color="#1c1409"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b12" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#120d08" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- background: hazy landscape with aerial perspective -->
  <rect width="400" height="600" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <path d="M0 296 L46 258 L86 284 L128 246 L168 286 L206 262 L246 290 L288 252 L330 288 L366 262 L400 298 L400 344 L0 344 Z" fill="url(#far)"/>
  </g>
  <path d="M0 332 L54 306 L104 328 L152 302 L200 330 L252 306 L300 332 L352 310 L400 336 L400 376 L0 376 Z" fill="url(#near)"/>
  <path d="M0 340 L40 330 L64 342 L96 332 L120 344 L0 352 Z" fill="#5e7a72" opacity="0.55"/>
  <path d="M300 336 L330 328 L360 340 L400 332 L400 348 L300 346 Z" fill="#5e7a72" opacity="0.5"/>
  <path d="M176 376 Q236 396 400 380 L400 408 L176 408 Z" fill="#7d9a95"/>
  <path d="M176 376 Q236 396 400 380" fill="none" stroke="#aebfb6" stroke-width="2" opacity="0.6"/>
  <path d="M0 376 L120 396 L108 456 L0 474 Z" fill="#5c5240"/>
  <path d="M400 380 L268 400 L286 474 L400 490 Z" fill="#544b39"/>
  <path d="M0 490 Q54 456 62 424 Q70 396 108 384" fill="none" stroke="#b0a184" stroke-width="6" opacity="0.75"/>
  <path d="M0 490 Q54 456 62 424 Q70 396 108 384" fill="none" stroke="#8c7d60" stroke-width="1.8" opacity="0.6"/>
  <path d="M0 456 L96 440 L124 506 L120 600 L0 600 Z" fill="#4a3a28"/>
  <path d="M400 474 L300 456 L286 524 L292 600 L400 600 Z" fill="#423525"/>
  <path d="M0 540 L148 502 L214 600 L0 600 Z" fill="#382b1d"/>
  <path d="M400 552 L262 516 L206 600 L400 600 Z" fill="#31261a"/>
  <path d="M20 520 L74 508 L92 540 L44 556 Z" fill="#54442e" opacity="0.6"/>
  <path d="M320 546 L368 534 L386 560 L336 574 Z" fill="#3d3020" opacity="0.6"/>

  <!-- figure: back hair mass, dress, veil -->
  <path d="M152 176 Q146 100 200 86 Q254 100 248 176 Q256 264 240 344 L232 392 Q200 408 168 394 L160 344 Q144 264 152 176 Z" fill="url(#hair)"/>
  <path d="M126 330 Q140 292 176 278 L200 292 L224 278 Q260 292 274 330 L306 600 L94 600 Z" fill="url(#dress)"/>
  <path d="M150 356 Q168 470 158 600" fill="none" stroke="#4a3d2b" stroke-width="3" opacity="0.5"/>
  <path d="M250 356 Q232 470 242 600" fill="none" stroke="#4a3d2b" stroke-width="3" opacity="0.5"/>
  <path d="M200 392 Q206 470 200 600" fill="none" stroke="#3c3123" stroke-width="4" opacity="0.45"/>
  <path d="M182 226 Q200 240 218 226 L222 278 Q200 294 178 278 Z" fill="#dcb286"/>
  <path d="M176 278 Q200 296 224 278 L236 318 Q200 344 164 318 Z" fill="#e0b98e"/>
  <path d="M162 168 Q166 96 200 84 Q234 96 238 168 Q232 108 200 100 Q168 108 162 168 Z" fill="#120d08" opacity="0.8"/>
  <path d="M154 190 L146 306 L166 308 L166 196 Z" fill="url(#veil)"/>
  <path d="M246 190 L254 306 L234 308 L234 196 Z" fill="url(#veil)"/>

  <!-- face -->
  <ellipse cx="200" cy="178" rx="45" ry="60" fill="url(#face)"/>
  <g filter="url(#soft)">
    <ellipse cx="200" cy="234" rx="30" ry="15" fill="#c08f60" opacity="0.5"/>
    <ellipse cx="167" cy="186" rx="15" ry="30" fill="#b98a5e" opacity="0.45"/>
    <ellipse cx="233" cy="186" rx="15" ry="30" fill="#b98a5e" opacity="0.45"/>
    <ellipse cx="200" cy="140" rx="34" ry="17" fill="#f6e0c0" opacity="0.6"/>
  </g>
  <circle cx="176" cy="204" r="15" fill="url(#cheek)"/>
  <circle cx="224" cy="204" r="15" fill="url(#cheek)"/>

  <!-- eyes (no eyebrows, as in the original) -->
  <path d="M166 170 Q177 162 188 170 Q177 176 166 170 Z" fill="#f2e6d4"/>
  <circle cx="177" cy="169" r="5" fill="#3a2a18"/>
  <path d="M166 170 Q177 159 188 170" fill="none" stroke="#4a3520" stroke-width="2"/>
  <path d="M166 170 Q177 178 188 170" fill="none" stroke="#8a6a4c" stroke-width="1"/>
  <path d="M212 170 Q223 162 234 170 Q223 176 212 170 Z" fill="#f2e6d4"/>
  <circle cx="223" cy="169" r="5" fill="#3a2a18"/>
  <path d="M212 170 Q223 159 234 170" fill="none" stroke="#4a3520" stroke-width="2"/>
  <path d="M212 170 Q223 178 234 170" fill="none" stroke="#8a6a4c" stroke-width="1"/>

  <!-- nose -->
  <g filter="url(#soft)">
    <path d="M204 178 Q209 194 206 206 Q200 210 195 204 Q198 190 196 178 Z" fill="#c08f60" opacity="0.5"/>
  </g>
  <path d="M192 206 Q196 209 199 205" fill="none" stroke="#a97a52" stroke-width="1.6" opacity="0.7"/>
  <path d="M208 206 Q204 209 201 205" fill="none" stroke="#a97a52" stroke-width="1.6" opacity="0.7"/>

  <!-- the smile, sfumato -->
  <g filter="url(#soft)">
    <path d="M180 220 Q200 228 220 219 Q200 236 180 220 Z" fill="#b5725c" opacity="0.9"/>
  </g>
  <path d="M180 220 Q200 227 220 219" fill="none" stroke="#8d5142" stroke-width="1.4" opacity="0.8"/>
  <path d="M182 218 Q200 214 218 217" fill="none" stroke="#c98f78" stroke-width="1" opacity="0.5"/>
  <path d="M178 219 Q186 212 196 216" fill="none" stroke="#7a4636" stroke-width="1.2" opacity="0.5"/>
  <path d="M222 218 Q214 211 204 216" fill="none" stroke="#7a4636" stroke-width="1.2" opacity="0.5"/>

  <!-- front hair framing and strands -->
  <path d="M200 92 Q168 96 160 132 Q176 112 200 110 Q224 112 240 132 Q232 96 200 92 Z" fill="#2b1f16"/>
  <path d="M160 150 Q150 224 162 300 Q168 352 160 392 L142 388 Q150 330 146 268 Q142 200 152 148 Z" fill="url(#hair)"/>
  <path d="M240 150 Q250 224 238 300 Q232 352 240 392 L258 388 Q250 330 254 268 Q258 200 248 148 Z" fill="url(#hair)"/>
  <path d="M158 160 Q152 240 166 312 Q172 352 164 388" fill="none" stroke="#4a3623" stroke-width="2" opacity="0.55"/>
  <path d="M242 160 Q248 240 234 312 Q228 352 236 388" fill="none" stroke="#4a3623" stroke-width="2" opacity="0.55"/>

  <!-- crossed hands -->
  <path d="M126 536 Q136 498 170 490 Q206 484 224 502 Q232 512 224 522 Q204 518 186 520 Q160 524 148 548 Z" fill="#dcb286"/>
  <path d="M274 540 Q262 502 228 496 Q210 492 200 506 Q196 518 208 526 Q226 524 238 532 Q252 542 258 556 Z" fill="#e6c195"/>
  <path d="M150 546 Q176 526 206 522" fill="none" stroke="#b98a5e" stroke-width="1.6" opacity="0.7"/>
  <path d="M156 552 Q182 534 212 528" fill="none" stroke="#b98a5e" stroke-width="1.4" opacity="0.5"/>
  <path d="M244 548 Q224 528 198 526" fill="none" stroke="#b98a5e" stroke-width="1.6" opacity="0.6"/>
  <path d="M120 562 Q140 500 168 494 L146 600 L96 600 Z" fill="#241c14"/>
  <path d="M280 572 Q258 508 232 500 L256 600 L306 600 Z" fill="#241c14"/>
</svg>
